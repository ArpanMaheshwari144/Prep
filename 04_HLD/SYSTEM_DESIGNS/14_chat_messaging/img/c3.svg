 preview (FCM / APNs)<br />bhejne se pehle server gira -&gt; DB me pehle se, khota nahi<br />Ravi wapas -&gt; aakhri mile ke baad sab do</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-n_P-5" data-look="classic" transform="translate(767.421875, 459)"><rect class="basic label-container" style="fill:#f9a825 !important" x="-255" y="-75" width="510" height="150"/><g class="label" style="color:#000 !important" transform="translate(-225, -60)"><rect/><foreignObject width="450" height="120"><div style="color: rgb(0, 0, 0) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 450px; text-align: center; width: 450px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#000 !important" class="nodeLabel"><p>Push<br />app band, khabar kaise<br />-&gt; Google FCM / Apple APNs phone ko ghanti dete, app band ho tab bhi<br />(push: FCM / APNs)</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>