<text x="30" y="68" font-size="15" fill="#9fb0c8">Laal number = yahan toot sakta hai, neeche usi number pe: laal = kya hua, hara = kaise bacha</text>

<text x="48" y="466" font-size="14" font-weight="700" fill="#3ddc97">Kyun chalta:</text>
<text x="160" y="466" font-size="13.5" fill="#cfeee0">Nishaan aage khisakta hai, ginti nahi hoti. Unread, tick, offline ke baad lena, sab isi se. Khoya to agli baar aa jaayega</text>

<text x="74" y="544" font-size="15" font-weight="700" fill="#ff5a6a">&#x27;Mila&#x27; raaste me kho gaya</text>
<text x="52" y="571" font-size="13.5" fill="#7fe0b0">Agli baar judte hi phone dobara bhejta,</text>

<text x="48" y="695" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>
<text x="48" y="719" font-size="13.5" fill="#e6dcb8">Har message pe &#x27;padha&#x27; record: 50 x 500 = 25,000 likhai</text>

<text x="48" y="787" font-size="13.5" fill="#c9d6e8">Tick: ek (server), do (phone), neeli (padh li). Har tick ek ulta message.</text>
<text x="48" y="809" font-size="13.5" fill="#c9d6e8">Do tick = delivered_upto, Ravi ka phone bhejta</text>
<text x="48" y="831" font-size="13.5" fill="#c9d6e8">Group me do tick? Sabse chhota nishaan &gt;= seq.</text>
<text x="48" y="853" font-size="13.5" fill="#c9d6e8">10 lakh ka broadcast? Tick band, sirf unread</text>
