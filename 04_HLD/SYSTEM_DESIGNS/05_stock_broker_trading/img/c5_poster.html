<text x="48" y="733" font-size="13.5" fill="#e6dcb8">Sirf book ki photo kabhi-kabhi le lo: Photo ke baad aaye order kahin likhe hi nahi, gaye   ·   Kram time se rakho: Do machine ki ghadi alag. Ek hi second me do order, kaun pehle pata nahi</text>
