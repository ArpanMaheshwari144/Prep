<text x="48" y="500" font-size="14" font-weight="700" fill="#3ddc97">Kyun chalta:</text>
<text x="160" y="500" font-size="13.5" fill="#cfeee0">&quot;Seat khaali hai?&quot; aur &quot;book karo&quot; ek hi UPDATE me (WHERE status = khaali). DB row pe taala lagata, ek-ek ko chalata: Arpan pehle gaya (1 row = mili), Ravi ko 0</text>
<text x="160" y="520" font-size="13.5" fill="#cfeee0">row = &quot;seat gayi&quot;</text>

<text x="52" y="666" font-size="13.5" fill="#7fe0b0">Chaaron ek transaction me</text>

<text x="436" y="598" font-size="15" font-weight="700" fill="#ff5a6a">Do log ulte kram me 4-4 seat le rahe,</text>
<text x="436" y="619" font-size="15" font-weight="700" fill="#ff5a6a">dono atke</text>
<text x="414" y="646" font-size="13.5" fill="#7fe0b0">DB ye ghera (deadlock) pakad ke ek ko rok</text>
<text x="414" y="666" font-size="13.5" fill="#7fe0b0">deta, wo dobara koshish kare. Seat hamesha</text>
<text x="414" y="686" font-size="13.5" fill="#7fe0b0">ek hi kram me lo (seat_id se)</text>

<text x="48" y="777" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>
<text x="48" y="801" font-size="13.5" fill="#e6dcb8">SELECT ... FOR UPDATE se pehle taala, phir likho: Chalta, par DB ke do chakkar aur taala lamba. Ek query me taala chhota   ·   Version number wala tareeka (optimistic): Haarne wala dobara</text>
<text x="48" y="821" font-size="13.5" fill="#e6dcb8">koshish karta. Yahan seedha bolo &quot;seat gayi&quot;</text>

<text x="48" y="889" font-size="13.5" fill="#c9d6e8">Network toota? Booking me pakka sahi chahiye (shak ho to mana). Seat list 2 sec purani bhi chalegi.</text>
<text x="48" y="911" font-size="13.5" fill="#c9d6e8">Seat ki row show banate hi ban jaati, booking sirf UPDATE. Ravi ne phir dabaya? Phir 0 row</text>
