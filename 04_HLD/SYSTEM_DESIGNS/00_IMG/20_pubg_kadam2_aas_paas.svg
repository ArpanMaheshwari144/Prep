  <g stroke="#e05561" stroke-width="2.5" stroke-linecap="round">
    <line x1="480" y1="390" x2="500" y2="380"/><line x1="480" y1="400" x2="503" y2="400"/><line x1="480" y1="410" x2="500" y2="420"/>
    <line x1="560" y1="380" x2="540" y2="372"/><line x1="560" y1="395" x2="537" y2="395"/><line x1="560" y1="410" x2="540" y2="418"/>
  </g>
  <text x="520" y="445" fill="#e8ecf5" font-size="12" text-anchor="middle">30 log lad rahe</text>

  <!-- no-send arrow -->
  <line x1="450" y1="352" x2="318" y2="300" stroke="#e05561" stroke-width="2.5" stroke-dasharray="7 5"/>
  <g transform="translate(384,326)" stroke="#e05561" stroke-width="4" stroke-linecap="round">
