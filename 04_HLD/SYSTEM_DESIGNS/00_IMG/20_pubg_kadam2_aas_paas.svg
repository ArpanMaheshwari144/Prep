  <!-- legend -->
  <rect x="30" y="480" width="18" height="14" fill="#2a2a14" stroke="#f5c542" stroke-width="2"/>
  <text x="56" y="492" fill="#e8ecf5" font-size="13">Arpan ka dabba</text>
  <rect x="190" y="480" width="18" height="14" fill="#16301f" stroke="#3fbf6f" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="216" y="492" fill="#e8ecf5" font-size="13">aas-paas ke dabbe: inki goli, kadam, awaaz bhejo</text>
  <rect x="30" y="510" width="18" height="14" fill="#3a1a1e" stroke="#e05561" stroke-width="2"/>
  <text x="56" y="522" fill="#e8ecf5" font-size="13">door ka dabba: Arpan ke phone pe kuch nahi (phone thanda, data bacha)</text>
