<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="600" fill="#0f1420"/>
  <text x="380" y="32" fill="#9fb3d9" font-size="18" text-anchor="middle" letter-spacing="1">FAISLA SERVER KA, PHONE KA NAHI</text>

  <!-- PANEL A: hit validation -->
  <rect x="20" y="50" width="720" height="250" fill="#141a29" stroke="#3a4a6b" stroke-width="1.5" rx="6"/>
  <text x="36" y="76" fill="#9fb3d9" font-size="14" font-weight="bold">KADAM 3: goli kisko lagi? server line kheenchta (hit validation, raycast)</text>

  <!-- Arpan shooter -->
  <g transform="translate(90,200)" stroke="#f5c542" stroke-width="3" stroke-linecap="round" fill="none">
    <circle cx="0" cy="-22" r="8" fill="#f5c542"/>
    <line x1="0" y1="-14" x2="0" y2="8"/>
    <line x1="-11" y1="-6" x2="11" y2="-6"/>
    <line x1="0" y1="8" x2="-8" y2="22"/>
    <line x1="0" y1="8" x2="8" y2="22"/>
    <line x1="8" y1="-8" x2="28" y2="-14" stroke="#c9ced8" stroke-width="4"/>
  </g>
  <text x="90" y="245" fill="#f5c542" font-size="13" text-anchor="middle" font-weight="bold">baagi Arpan</text>

  <!-- ray -->
  <line x1="120" y1="186" x2="602" y2="178" stroke="#f5c542" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="300" y="170" fill="#f5c542" font-size="12">goli ki seedhi line (server kheenchta)</text>

  <!-- wall above line, not blocking -->
  <rect x="380" y="92" width="22" height="64" fill="#5a6378" stroke="#8b94a8"/>
  <text x="410" y="118" fill="#c9ced8" font-size="12">deewar: line ke beech?</text>
  <text x="410" y="134" fill="#3fbf6f" font-size="12">nahi, line saaf</text>

  <!-- Claude target with hitbox -->
  <g transform="translate(620,200)" stroke="#e8833a" stroke-width="3" stroke-linecap="round" fill="none">
    <circle cx="0" cy="-22" r="8" fill="#e8833a"/>
    <line x1="0" y1="-14" x2="0" y2="8"/>
    <line x1="-11" y1="-6" x2="11" y2="-6"/>
    <line x1="0" y1="8" x2="-8" y2="22"/>
    <line x1="0" y1="8" x2="8" y2="22"/>
  </g>
  <rect x="604" y="164" width="32" height="30" fill="none" stroke="#e05561" stroke-width="2"/>
  <rect x="604" y="196" width="32" height="34" fill="none" stroke="#6f84a8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="645" y="178" fill="#e05561" font-size="12">sar = headshot</text>
  <text x="645" y="216" fill="#9fb3d9" font-size="12">body / pair</text>
  <text x="620" y="252" fill="#e8833a" font-size="13" text-anchor="middle" font-weight="bold">Claude ka gudda</text>
  <text x="380" y="285" fill="#e8ecf5" font-size="13" text-anchor="middle">line Claude ke sar se guzri -> "Arpan killed Claude (headshot)". Line 5-6 m door -> koi nahi mara.</text>

  <!-- PANEL B: movement validation -->
  <rect x="20" y="320" width="720" height="260" fill="#141a29" stroke="#3a4a6b" stroke-width="1.5" rx="6"/>
  <text x="36" y="346" fill="#9fb3d9" font-size="14" font-weight="bold">KADAM 4: wahan pahunch sakta tha? (movement validation)</text>

  <!-- start position + reach circle -->
  <circle cx="150" cy="460" r="58" fill="#16301f" stroke="#3fbf6f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="150" y="392" fill="#3fbf6f" font-size="12" text-anchor="middle">1 sec me bas yahin tak</text>
  <g transform="translate(150,468)" stroke="#e05561" stroke-width="3" stroke-linecap="round" fill="none">
    <circle cx="0" cy="-22" r="8" fill="#e05561"/>
    <line x1="0" y1="-14" x2="0" y2="8"/>
    <line x1="-11" y1="-6" x2="11" y2="-6"/>
    <line x1="0" y1="8" x2="-8" y2="22"/>
    <line x1="0" y1="8" x2="8" y2="22"/>
  </g>
  <text x="150" y="540" fill="#e8ecf5" font-size="12" text-anchor="middle">hacker, School pe (pichhli jagah)</text>

  <!-- jump -->
  <path d="M 210 450 Q 400 360 585 448" stroke="#e05561" stroke-width="2.5" fill="none" stroke-dasharray="8 6"/>
  <text x="398" y="392" fill="#e05561" font-size="13" text-anchor="middle">phone: "1 sec me 500 m aage, Arpan ke peeche"</text>
  <g transform="translate(398,418)" stroke="#e05561" stroke-width="4" stroke-linecap="round">
    <line x1="-11" y1="-11" x2="11" y2="11"/><line x1="11" y1="-11" x2="-11" y2="11"/>
  </g>

  <!-- ghost at destination -->
  <g transform="translate(610,468)" stroke="#e05561" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.35">
    <circle cx="0" cy="-22" r="8" fill="#e05561"/>
    <line x1="0" y1="-14" x2="0" y2="8"/>
    <line x1="-11" y1="-6" x2="11" y2="-6"/>
    <line x1="0" y1="8" x2="-8" y2="22"/>
    <line x1="0" y1="8" x2="8" y2="22"/>
  </g>
  <g transform="translate(660,468)" stroke="#f5c542" stroke-width="3" stroke-linecap="round" fill="none">
    <circle cx="0" cy="-22" r="8" fill="#f5c542"/>
    <line x1="0" y1="-14" x2="0" y2="8"/>
    <line x1="-11" y1="-6" x2="11" y2="-6"/>
    <line x1="0" y1="8" x2="-8" y2="22"/>
    <line x1="0" y1="8" x2="8" y2="22"/>
  </g>
  <text x="635" y="512" fill="#e8ecf5" font-size="12" text-anchor="middle">Arpan</text>
  <text x="380" y="566" fill="#e8ecf5" font-size="13" text-anchor="middle">Koramangala se 1 sec me Whitefield namumkin -> update phenk do, agli baar match me ghusne mat do (ban)</text>
</svg>
