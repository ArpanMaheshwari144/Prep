<!doctype html>
<!-- Card 3 chalti tasveer. GIF banane ke liye: node 04_HLD/tools/anim2gif.js <is file> -->
<meta charset="utf-8">
<style>
body{margin:0;background:#11161c}
svg text{font-family:Consolas,"Courier New",monospace;fill:#e6edf3}
.box{fill:#222d3a;stroke:#4b5a6a;stroke-width:1.5}

.msg text{font-size:13px;fill:#64b5f6;font-weight:bold;paint-order:stroke;stroke:#11161c;stroke-width:5px}
</style>
<svg id="s" width="900" height="400" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="400" fill="#11161c"/>
  <rect id="capbg" x="0" y="0" width="900" height="44" fill="#3a1414"/>
  <text id="cap" x="20" y="29" style="font-size:17px;font-weight:bold">DIKKAT: key nahi di</text>

  <g transform="translate(0,50)">
    <path class="wire" d="M90 170 H120"/><path class="wire" d="M240 170 H300"/>
    <path class="wire" d="M560 80 H614"/><path class="wire" d="M560 170 H614"/><path class="wire" d="M560 260 H614"/>
    <path class="wire" d="M666 80 L740 160"/><path class="wire" d="M666 170 H740"/><path class="wire" d="M666 260 L740 180"/>

    <rect class="box" x="10" y="110" width="80" height="120" rx="12"/>
    <text class="lbl" x="50" y="160" text-anchor="middle">Ravi</text>
    <text class="small" x="50" y="178" text-anchor="middle">ka phone</text>

    <rect class="box" x="120" y="145" width="120" height="50" rx="8"/>
    <text class="lbl" x="180" y="168" text-anchor="middle">User Service</text>
    <text class="small" x="180" y="184" text-anchor="middle">(producer)</text>

    <rect x="280" y="20" width="300" height="300" rx="10" fill="none" stroke="#4b5a6a" stroke-dasharray="6 4"/>
    <text class="lbl" x="292" y="40">Kafka · topic: user-update</text>
    <text class="small" x="430" y="340" text-anchor="middle">(asli me 10 tukde, yahan 3 dikhaye)</text>
    <rect class="lane" x="300" y="55" width="260" height="50" rx="8"/><text class="small" x="308" y="70">P0</text>
    <rect class="lane" x="300" y="145" width="260" height="50" rx="8"/><text class="small" x="308" y="160">P1</text>
    <rect class="lane" x="300" y="235" width="260" height="50" rx="8"/><text class="small" x="308" y="250">P2</text>
    <text id="code" x="292" y="312" style="font-size:14px;fill:#f0a030"></text>

    <circle class="box" cx="640" cy="80" r="26"/><text class="lbl" x="640" y="85" text-anchor="middle">X</text>
    <circle class="box" cx="640" cy="170" r="26"/><text class="lbl" x="640" y="175" text-anchor="middle">Y</text>
    <circle class="box" cx="640" cy="260" r="26"/><text class="lbl" x="640" y="265" text-anchor="middle">Z</text>
    <text class="small" x="640" y="40" text-anchor="middle">consumer group</text>
    <text id="slow" x="640" y="124" text-anchor="middle" style="font-size:13px;fill:#ef5350"></text>

    <rect class="box" x="740" y="130" width="150" height="80" rx="10"/>
    <text class="small" x="815" y="152" text-anchor="middle">DB: Ravi ka naam</text>
    <text id="db" x="815" y="185" text-anchor="middle" style="font-size:16px;font-weight:bold">Ravi</text>

    <g id="m1" class="msg"><circle r="7"/><text y="-30" text-anchor="middle">Ravi S</text></g>
    <g id="m2" class="msg"><circle r="7"/><text y="-30" text-anchor="middle">Ravi Kumar</text></g>
  </g>
</svg>
<script>
const DUR = 15;
// [time, x, y] keyframes; null = chhupa
const BUG1 = [[0.8,180,170],[1.3,300,170],[2.3,300,80],[2.6,540,80],[4.6,540,80],[5.4,640,80],[6.0,770,165]];
const BUG2 = [[1.2,180,170],[1.7,300,170],[2.6,540,170],[3.0,640,170],[3.5,770,170]];
const FIX1 = [[8.0,180,170],[8.5,300,170],[9.4,540,170],[9.8,640,170],[10.3,770,170]];
const FIX2 = [[8.4,180,170],[8.9,300,170],[9.6,470,170],[10.3,470,170],[10.7,540,170],[11.1,640,170],[11.6,770,170]];
function at(k, t){
  if (t < k[0][0] || t > k[k.length-1][0]) return null;
  for (let i = 1; i < k.length; i++) if (t <= k[i][0]) {
    const a = k[i-1], b = k[i], f = (t - a[0]) / (b[0] - a[0] || 1);
    return [a[1] + (b[1]-a[1]) * f, a[2] + (b[2]-a[2]) * f];
  }
}
function put(id, p){ const g = document.getElementById(id);
  if (!p) { g.setAttribute('visibility','hidden'); return; }
  g.setAttribute('visibility','visible'); g.setAttribute('transform', `translate(${p[0]} ${p[1]})`); }
function txt(id, s, color){ const e = document.getElementById(id); e.textContent = s; if (color) e.style.fill = color; }
function draw(t){
  const fix = t >= 7.5;
  document.getElementById('capbg').setAttribute('fill', fix ? '#123018' : '#3a1414');
  txt('cap', fix ? 'ILAAJ: key = userId. Ravi ki har khabar ek hi partition (P1) me, kram se'
                 : (t < 6 ? 'DIKKAT: key nahi di, producer ne khabar baant di (P0, P1)'
                          : 'DIKKAT: X dheema tha, purana naam naye ke upar likh gaya'), '#e6edf3');
  txt('code', fix ? 'key "u-42" -> hash % 3 = 1 -> P1' : '');
  txt('slow', !fix && t >= 2.6 ? 'X dheema' : '');
  let db = ['Ravi', '#e6edf3'];
  if (!fix) { if (t >= 3.5) db = ['Ravi Kumar', '#66bb6a']; if (t >= 6.0) db = ['Ravi S  (purana!)', '#ef5350']; }
  else { if (t >= 10.3) db = ['Ravi S', '#e6edf3']; if (t >= 11.6) db = ['Ravi Kumar', '#66bb6a']; }
  txt('db', db[0], db[1]);
  put('m1', fix ? at(FIX1, t) : at(BUG1, t));
  put('m2', fix ? at(FIX2, t) : at(BUG2, t));
}
draw(0);
</script>
