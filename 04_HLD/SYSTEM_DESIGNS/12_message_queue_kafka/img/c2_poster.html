<text x="160" y="656" font-size="13.5" fill="#cfeee0">Topic ke tukde (partition) bana do. Ek tukde ko ek hi worker padhta, to 10 tukde = 10 worker ek saath. Bheed badhe to tukde badhao</text>
<rect x="30" y="704" width="345" height="148" rx="9" fill="#1a0f14" stroke="#ff5a6a" stroke-width="2"/>

<text x="74" y="734" font-size="15" font-weight="700" fill="#ff5a6a">Line lambi thi, Arpan ne 11va worker</text>
<text x="74" y="755" font-size="15" font-weight="700" fill="#ff5a6a">(W10) joda, kuch farak nahi</text>
<text x="52" y="782" font-size="13.5" fill="#7fe0b0">Saare 10 tukde pehle se W0-W9 ke paas. W10</text>
<text x="52" y="802" font-size="13.5" fill="#7fe0b0">ko padhne ke liye koi tukda mila hi nahi.</text>
<text x="52" y="822" font-size="13.5" fill="#7fe0b0">Pehle tukde badhao</text>

<text x="48" y="913" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>
<text x="48" y="937" font-size="13.5" fill="#e6dcb8">Ek hi line me aur worker laga dete: Bekaar: ek line ko ek hi worker padh sakta, baaki worker khaali baithe rehte</text>
<rect x="30" y="975" width="1440" height="72" rx="9" fill="#141c2b" stroke="#3a4a63" stroke-width="2"/>
<text x="48" y="1005" font-size="13.5" fill="#c9d6e8">Kitne tukde rakhein? Jitne worker ek saath chahiye: 5,000 / sec ÷ 500 ek worker = 10. Shuru me thoda zyada rakho, baad me badhaoge to key ka tukda badal jaata.</text>
<text x="48" y="1027" font-size="13.5" fill="#c9d6e8">12 worker aur 10 tukde? 2 worker khaali baithe rahenge</text>
