<text x="48" y="531" font-size="14" font-weight="700" fill="#3ddc97">Kyun chalta:</text>
<text x="160" y="531" font-size="13.5" fill="#cfeee0">Email Svc ki saari machine ek hi team (group.id) me hain. Team ke andar har tukda sirf ek machine ko milta, to Arpan ki khabar team me ek hi baar padhi jaati,</text>
<text x="160" y="551" font-size="13.5" fill="#cfeee0">ek hi email</text>

<text x="74" y="629" font-size="15" font-weight="700" fill="#ff5a6a">Team ki ek machine (C2) gir gayi</text>
<text x="52" y="656" font-size="13.5" fill="#7fe0b0">Kafka uske tukde baaki machine (C1, C3) ko</text>
<text x="52" y="676" font-size="13.5" fill="#7fe0b0">de deta (rebalance). Koi tukda bina padhne</text>
<text x="52" y="696" font-size="13.5" fill="#7fe0b0">wale ke nahi rehta</text>

<text x="48" y="787" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>
<text x="48" y="811" font-size="13.5" fill="#e6dcb8">Har machine ka group.id alag (jaise machine ka naam): To Kafka teeno ko alag team samjhega, teeno ne email bheja: Arpan ko 3 email</text>
<rect x="30" y="849" width="1440" height="72" rx="9" fill="#141c2b" stroke="#3a4a63" stroke-width="2"/>
<text x="48" y="879" font-size="13.5" fill="#c9d6e8">Team me machine badhani hai? To tukde bhi badhao.</text>
<text x="48" y="901" font-size="13.5" fill="#c9d6e8">10 tukde aur 12 machine = 2 machine khaali</text>
