<text x="30" y="40" font-size="26" font-weight="700" fill="#e6edf3">Card 1: disk pe log, padhne se mitta nahi. Har group apna offset yaad rakhta, restart pe wahin se</text>
<text x="30" y="68" font-size="15" fill="#9fb0c8">Laal number = yahan toot sakta hai, neeche usi number pe: laal = kya hua, hara = kaise bacha</text>

<text x="48" y="113" font-size="15" font-weight="700" fill="#9fb0c8">Peeche:</text>
<text x="118" y="113" font-size="14.5" fill="#c9d6e8">shuru: ek machine, uski RAM me ek queue</text>
<text x="760" y="113" font-size="15" font-weight="700" fill="#ff8a95">Ab:</text>
<text x="796" y="113" font-size="14.5" fill="#f0d4d8">Subah queue machine restart, Arpan ka order + 499 aur gayab</text>

<text x="140.0" y="248" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle">Order Svc</text>
<text x="140.0" y="274" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">Arpan #101 + 499 order</text>
<rect x="330" y="174" width="520" height="180" rx="12" fill="#1d1838" stroke="#a98bff" stroke-width="2.5"/>
<text x="590.0" y="208" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle">Kafka log (disk)</text>
<text x="590.0" y="234" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">msg 0, 1, 2 ... 500 (aakhir me judta)</text>
<text x="590.0" y="256" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">padhne se mitta nahi</text>
<text x="590.0" y="278" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">sirf aakhir me jodna = tez (sequential)</text>

<text x="1080.0" y="248" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle">Email Svc</text>
<text x="1080.0" y="274" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">offset 120 yaad</text>
<text x="1080.0" y="296" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">restart: 121 se</text>

<text x="48" y="440" font-size="14" font-weight="700" fill="#3ddc97">Kyun chalta:</text>
<text x="160" y="440" font-size="13.5" fill="#cfeee0">Khabar RAM me nahi, disk pe likhi hai, isliye restart pe nahi mitti. Email Svc yaad rakhta hai kahan tak padha (offset). Wapas aake wahin se aage padhta, Order</text>
<text x="160" y="460" font-size="13.5" fill="#cfeee0">Svc ko pata bhi nahi chalta</text>
<rect x="30" y="508" width="345" height="127" rx="9" fill="#1a0f14" stroke="#ff5a6a" stroke-width="2"/>
<circle cx="52" cy="533" r="12" fill="#ff5a6a"/>
<text x="52" y="538" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">1</text>
<text x="74" y="538" font-size="15" font-weight="700" fill="#ff5a6a">Subah queue wali machine restart hui</text>
<text x="52" y="565" font-size="13.5" fill="#7fe0b0">Khabar disk pe padi rahi. Email Svc ko yaad</text>
<text x="52" y="585" font-size="13.5" fill="#7fe0b0">tha ki 120 tak padh chuka, wapas aake 121 se</text>
<text x="52" y="605" font-size="13.5" fill="#7fe0b0">aage padha</text>
<rect x="30" y="670" width="1440" height="66" rx="9" fill="#221c08" stroke="#ffcc4d" stroke-width="2"/>
<text x="48" y="696" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>
<text x="48" y="720" font-size="13.5" fill="#e6dcb8">Queue ko machine ki RAM me rakhte: Restart hote hi RAM khaali: Arpan ka order aur baaki 499 hamesha ke liye gaye</text>
<rect x="30" y="758" width="1440" height="72" rx="9" fill="#141c2b" stroke="#3a4a63" stroke-width="2"/>
<text x="48" y="788" font-size="13.5" fill="#c9d6e8">Kal ki khabar dobara padhni ho to? Offset peeche kar do (replay), khabar disk pe wahin padi hai.</text>
<text x="48" y="810" font-size="13.5" fill="#c9d6e8">Offset = line me khabar ka number (0, 1, 2 ...). Kafka ek chhoti .index file rakhta jo batati number wali khabar file me kahan hai</text>
<rect x="30" y="852" width="1440" height="44" rx="9" fill="#221c08" stroke="#ffcc4d" stroke-width="2"/>
<text x="48" y="880" font-size="15" font-weight="700" fill="#ffcc4d">AGLA &gt;</text>
<text x="118" y="880" font-size="14.5" fill="#e6dcb8">ab sale aayi: ek worker kitna jhelega? (card 2)</text>
