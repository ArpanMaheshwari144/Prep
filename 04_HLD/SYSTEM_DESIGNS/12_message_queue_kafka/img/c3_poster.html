<text x="160" y="510" font-size="13.5" fill="#cfeee0">Kram sirf EK tukde (partition) ke andar pakka hota hai. Isliye jiska kram chahiye usi ko key banao (userId): same key hamesha same tukde me jaati, to Arpan ki</text>

<text x="74" y="608" font-size="15" font-weight="700" fill="#ff5a6a">Arpan ne naam badla, pehle A phir B. A</text>

<text x="48" y="807" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>
<text x="48" y="831" font-size="13.5" fill="#e6dcb8">Poore topic ki saari khabar ek hi kram me rakhein: Bekaar: Arpan aur Sita ki khabar ka aapas me kram kisi ko chahiye hi nahi. Aur ek kram = ek hi tukda = phir wahi bheed</text>

<text x="48" y="921" font-size="13.5" fill="#c9d6e8">RabbitMQ / SQS me kram? Pakka nahi milta. SQS FIFO ya ek hi padhne wala ho tab kram milta, par speed kam</text>
