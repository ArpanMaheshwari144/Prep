  <text x="360" y="262" fill="#9fb3d9" font-size="16" text-anchor="middle">ghadi ki disha me</text>
  <text x="360" y="284" fill="#9fb3d9" font-size="16" text-anchor="middle">aage chalo</text>
  <g font-size="16" text-anchor="middle">
    <rect x="300" y="70" width="120" height="60" rx="6" fill="#1e2638" stroke="#3a4a6b" stroke-width="2"/>
    <text x="360" y="95" fill="#e8ecf5">Almari 3</text><rect x="312" y="108" width="96" height="8" rx="3" fill="#0f1420" stroke="#3a4a6b"/><rect x="312" y="108" width="82" height="8" rx="3" fill="#e0a040"/>
    <rect x="470" y="240" width="120" height="60" rx="6" fill="#1e2638" stroke="#3a4a6b" stroke-width="2"/>
    <text x="530" y="265" fill="#e8ecf5">Almari 7</text><rect x="482" y="278" width="96" height="8" rx="3" fill="#0f1420" stroke="#3a4a6b"/><rect x="482" y="278" width="58" height="8" rx="3" fill="#e0a040"/>
    <rect x="375" y="387" width="140" height="60" rx="6" fill="#2e7d4f" stroke="#3fbf6f" stroke-width="2"/>
    <text x="445" y="412" fill="#ffffff">Nayi almari 10</text><rect x="392" y="425" width="106" height="8" rx="3" fill="#0f1420" stroke="#3a4a6b"/><rect x="392" y="425" width="32" height="8" rx="3" fill="#3fbf6f"/>
    <rect x="153" y="325" width="120" height="60" rx="6" fill="#1e2638" stroke="#3a4a6b" stroke-width="2"/>
    <text x="213" y="350" fill="#e8ecf5">Almari 1</text><rect x="165" y="363" width="96" height="8" rx="3" fill="#0f1420" stroke="#3a4a6b"/><rect x="165" y="363" width="82" height="8" rx="3" fill="#e0a040"/>
  </g>
  <circle cx="507" cy="355" r="10" fill="#f5c542"/>
  <path d="M 500.9 365.1 A 170 170 0 0 1 480 391" fill="none" stroke="#f5c542" stroke-width="4" marker-end="url(#ah)"/>
  <line x1="517" y1="350" x2="590" y2="330" stroke="#f5c542" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="596" y="322" fill="#f5c542" font-size="15">Token aB3x9</text>
  <text x="596" y="341" fill="#f5c542" font-size="13">(hash yahan gira)</text>
  <text x="528" y="410" fill="#e8ecf5" font-size="14">toofan me: paas ka</text>
  <text x="528" y="429" fill="#e8ecf5" font-size="14">shelter</text>
  <text x="360" y="512" fill="#9fb3d9" font-size="14" text-anchor="middle">Saari almari ek saath bharti (85%). Nayi 10 aayi: 7 ka kuch hissa le liya (85% se 60%), baaki apni jagah</text>
  <text x="24" y="470" fill="#9fb3d9" font-size="13">patti = kitni bhari</text>
</svg>
