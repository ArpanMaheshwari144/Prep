      <path d="M0,0 L10,5 L0,10 z" fill="#f5c542"/>
    </marker>
    <marker id="cw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8fa3c7"/>
    </marker>
  </defs>
  <rect width="720" height="540" fill="#0f1420"/>
  <text x="360" y="34" fill="#9fb3d9" font-size="18" text-anchor="middle" letter-spacing="1">GOL CHAKKAR (consistent hashing)</text>
