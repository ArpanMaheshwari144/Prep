<text x="48" y="795" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>
<text x="48" y="819" font-size="13.5" fill="#e6dcb8">UUID ya lambe link ka hash (pehle 7 akshar) le lete: UUID 36 akshar ka, link lamba ho jaata. Hash me do link ka code same aa sakta, har baar DB me &quot;pehle se hai?&quot; dekhna padta. Counter me</text>
<text x="48" y="839" font-size="13.5" fill="#e6dcb8">takkar hoti hi nahi   ·   Har number Redis se ek-ek le lete (INCR): Chalta, par har link pe ek call. Dabbe me 1000 link pe ek call. Haan, agar ek bhi number bekaar nahi jaana chahiye to</text>

<text x="48" y="927" font-size="13.5" fill="#c9d6e8">Dabba khatam? Counter se agla dabba le lo.</text>
<text x="48" y="949" font-size="13.5" fill="#c9d6e8">Agla code koi andaza na lagaye: number ko thoda ghuma do (shuffle / XOR), phir code banao</text>
<text x="48" y="971" font-size="13.5" fill="#c9d6e8">base62 = number ko 62 akshar (0-9, a-z, A-Z) me likhna: 125 = &quot;21&quot;, 100 crore = &quot;15FTGg&quot;.</text>
<text x="48" y="993" font-size="13.5" fill="#c9d6e8">Do log same lamba link dein to dono ko alag code milta. Ek hi chahiye to pehle lambe link ka hash dekh lo</text>
