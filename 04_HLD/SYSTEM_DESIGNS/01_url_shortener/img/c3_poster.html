<text x="48" y="715" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>
<text x="48" y="739" font-size="13.5" fill="#e6dcb8">UUID ya lambe link ka hash (pehle 7 akshar) lete: UUID 36 akshar, lamba. Hash me do link ka code same ho sakta. Har baar DB me &#x27;pehle se hai?&#x27; dekhna padta. Counter me takkar hi nahi   ·</text>
<text x="48" y="759" font-size="13.5" fill="#e6dcb8">Har number Redis INCR se le lete: Chalta, par har link pe ek call. Range me 1000 link pe ek. Ek bhi number bekaar na jaaye, to range ka fayda hi khatam</text>
<rect x="30" y="797" width="1440" height="116" rx="9" fill="#141c2b" stroke="#3a4a63" stroke-width="2"/>
<text x="48" y="827" font-size="13.5" fill="#c9d6e8">Range khatam? Counter se agli range le lo.</text>
<text x="48" y="849" font-size="13.5" fill="#c9d6e8">Agla code andaza na lage: number shuffle / XOR, phir base62</text>
<text x="48" y="871" font-size="13.5" fill="#c9d6e8">base62 = 0-9, a-z, A-Z: 125 = &#x27;21&#x27;, 100 crore = &#x27;15FTGg&#x27;. Do log same lamba link dein to dono ko alag code.</text>
<text x="48" y="893" font-size="13.5" fill="#c9d6e8">Ek hi code chahiye to pehle lambe link ke hash pe dekh lo</text>
