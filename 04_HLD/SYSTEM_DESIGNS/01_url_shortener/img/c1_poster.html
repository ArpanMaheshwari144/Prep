<text x="48" y="422" font-size="14" font-weight="700" fill="#3ddc97">Kyun chalta:</text>
<text x="160" y="422" font-size="13.5" fill="#cfeee0">Redis RAM me hai, ~0.1 ms me jawab deta. DB disk pe, ~10 ms. 100 me se 95 click Redis se hi nikal jaate, DB aaram se rehta. Asli data DB me hi hai, Redis sirf</text>
<text x="160" y="442" font-size="13.5" fill="#cfeee0">jaldi wali copy, kho bhi jaaye to DB se dobara ban jaati</text>
<rect x="30" y="490" width="345" height="148" rx="9" fill="#1a0f14" stroke="#ff5a6a" stroke-width="2"/>
<circle cx="52" cy="515" r="12" fill="#ff5a6a"/>
<text x="52" y="520" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">1</text>
<text x="74" y="520" font-size="15" font-weight="700" fill="#ff5a6a">Redis bhar gaya</text>
<text x="52" y="547" font-size="13.5" fill="#7fe0b0">Jo link sabse der se nahi khula, use nikaal</text>
<text x="52" y="567" font-size="13.5" fill="#7fe0b0">do (LRU). Arpan ka garam link andar hi rehta</text>
<rect x="392" y="490" width="345" height="148" rx="9" fill="#1a0f14" stroke="#ff5a6a" stroke-width="2"/>
<circle cx="414" cy="515" r="12" fill="#ff5a6a"/>
<text x="414" y="520" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">2</text>
<text x="436" y="520" font-size="15" font-weight="700" fill="#ff5a6a">Redis hi gir gaya</text>
<text x="414" y="547" font-size="13.5" fill="#7fe0b0">Uski copy turant kaam sambhal leti. Copy bhi</text>
<text x="414" y="567" font-size="13.5" fill="#7fe0b0">gayi to 1000 click me se sirf ek DB tak</text>
<text x="414" y="587" font-size="13.5" fill="#7fe0b0">jaata, baaki uska jawab ruk ke le lete</text>
<rect x="754" y="490" width="345" height="148" rx="9" fill="#1a0f14" stroke="#ff5a6a" stroke-width="2"/>
<circle cx="776" cy="515" r="12" fill="#ff5a6a"/>
<text x="776" y="520" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">3</text>
<text x="798" y="520" font-size="15" font-weight="700" fill="#ff5a6a">Arpan ne link badla, par Redis me</text>
<text x="798" y="541" font-size="15" font-weight="700" fill="#ff5a6a">purana pada tha</text>
<text x="776" y="568" font-size="13.5" fill="#7fe0b0">Pehle DB me naya likho, phir Redis se purana</text>
<text x="776" y="588" font-size="13.5" fill="#7fe0b0">hata do. Agla click DB se naya laata</text>
<rect x="1116" y="490" width="345" height="148" rx="9" fill="#1a0f14" stroke="#ff5a6a" stroke-width="2"/>
<circle cx="1138" cy="515" r="12" fill="#ff5a6a"/>
<text x="1138" y="520" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">4</text>
<text x="1160" y="520" font-size="15" font-weight="700" fill="#ff5a6a">Bot ne nakli code (/xyz999) pe lakhon</text>
<text x="1160" y="541" font-size="15" font-weight="700" fill="#ff5a6a">click bheje</text>
<text x="1138" y="568" font-size="13.5" fill="#7fe0b0">Itna bada number abhi tak diya hi nahi gaya,</text>
<text x="1138" y="588" font-size="13.5" fill="#7fe0b0">to App wahin 404 bol deta. DB tak koi nahi</text>
<text x="1138" y="608" font-size="13.5" fill="#7fe0b0">jaata</text>
<rect x="30" y="673" width="1440" height="86" rx="9" fill="#221c08" stroke="#ffcc4d" stroke-width="2"/>
<text x="48" y="699" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>
<text x="48" y="723" font-size="13.5" fill="#e6dcb8">DB ki copy (replica) ya Memcached laga dete: Copy bhi disk se padhti, to dheemi hi rehti. Memcached ki apni copy nahi hoti, gira to saari bheed seedha DB pe   ·   Har App apna alag cache</text>
<text x="48" y="743" font-size="13.5" fill="#e6dcb8">rakh le: Arpan ne link badla to har App ke paas purani copy reh jaati. Isliye sabka ek hi Redis</text>
<rect x="30" y="781" width="1440" height="72" rx="9" fill="#141c2b" stroke="#3a4a63" stroke-width="2"/>
<text x="48" y="811" font-size="13.5" fill="#c9d6e8">Ek link viral hua to DB ki wo machine garam ho jaayegi? Nahi, wo link pehle hi Redis me mil jaata.</text>
<text x="48" y="833" font-size="13.5" fill="#c9d6e8">Delete ya expire hua link: Redis me &quot;ye link nahi hai&quot; 1 min ke liye likh do, taaki DB se baar-baar na poocha jaaye</text>
<rect x="30" y="875" width="1440" height="44" rx="9" fill="#221c08" stroke="#ffcc4d" stroke-width="2"/>
<text x="48" y="903" font-size="15" font-weight="700" fill="#ffcc4d">AGLA &gt;</text>
<text x="118" y="903" font-size="14.5" fill="#e6dcb8">ab App hi ek machine hai. Wo giri to? (card 2)</text>
