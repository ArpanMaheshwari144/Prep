<text x="48" y="362" font-size="14" font-weight="700" fill="#3ddc97">Kyun chalta:</text>
<text x="160" y="362" font-size="13.5" fill="#cfeee0">Redis RAM se ~0.1 ms, DB disk se ~10 ms. 95% click Redis se hi nikal jaate hain. Sach ek hi jagah hai, DB me. Redis sirf garam copy hai, khoyi to DB se wapas</text>
<text x="160" y="382" font-size="13.5" fill="#cfeee0">ban jaati</text>

<text x="1160" y="481" font-size="15" font-weight="700" fill="#ff5a6a">click bheje</text>
<text x="1138" y="508" font-size="13.5" fill="#7fe0b0">Itna number diya hi nahi, to App wahin 404.</text>
<text x="1138" y="528" font-size="13.5" fill="#7fe0b0">DB tak nahi jaata</text>

<text x="48" y="619" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>
<text x="48" y="643" font-size="13.5" fill="#e6dcb8">DB ki copy (replica) ya Memcached laga dete: Replica bhi disk se padhti, dheemi hi rehti. Memcached me copy nahi, gira to bheed seedha DB pe   ·   Har App apna cache rakh le: Link badla to</text>
<text x="48" y="663" font-size="13.5" fill="#e6dcb8">har App ki copy purani reh jaati. Isliye ek shared Redis</text>

<text x="48" y="731" font-size="13.5" fill="#c9d6e8">Ek link viral, to uski DB machine garam ho jaayegi? Nahi, wo link pehle hi Redis me mil jaata.</text>
<text x="48" y="753" font-size="13.5" fill="#c9d6e8">Deleted / expire hua link: Redis me &#x27;nahi hai&#x27; 1 min rakho, taaki DB baar-baar na poocha jaaye</text>
