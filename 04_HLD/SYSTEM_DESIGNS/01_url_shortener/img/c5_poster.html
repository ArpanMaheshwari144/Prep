<text x="48" y="754" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>
<text x="48" y="778" font-size="13.5" fill="#e6dcb8">Country se baant dete, ya ek badi machine le lete: Country: code dekh ke pata nahi, saari machine poochni padti. Ek machine: 90 TB usme aata hi nahi   ·   Seedha code % machine se baant</text>

<text x="48" y="866" font-size="13.5" fill="#c9d6e8">Data sirf ~500 GB hota to? Ek MySQL kaafi. Shard tab, jab ek machine me na aaye.</text>

<text x="48" y="932" font-size="13.5" fill="#c9d6e8">Copy badhane se likhna tez? Nahi, har copy pe likhna padta. Likhne ka bojh = shard</text>
