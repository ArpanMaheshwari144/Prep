<text x="30" y="40" font-size="26" font-weight="700" fill="#e6edf3">Card 3: multipart: 100 tukde, har tukde ki rasid (ETag) S3 pe. Wifi gaya to sirf bache tukde</text>

<text x="48" y="541" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>

<text x="48" y="633" font-size="13.5" fill="#c9d6e8">Tukda kitna bada? Min 5 MB (aakhri chhod ke), max 10,000 tukde. Badi file to bada tukda.</text>
