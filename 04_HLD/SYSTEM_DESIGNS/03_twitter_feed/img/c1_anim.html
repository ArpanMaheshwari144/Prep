<!doctype html>
<!-- banaya: tools/anim_build.py se. Badlaav scene .js me karo, ye file dobara banti hai. -->
<meta charset="utf-8">
<style>body{margin:0;background:#11161c} svg text{font-family:Consolas,"Courier New",monospace}
svg .sans{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}</style>
<svg id="root" width="900" height="400" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
<rect id="bgr" width="900" height="400" fill="#11161c"/>
<rect id="capbg" x="0" y="0" width="900" height="44" fill="#3a1414"/>
<text id="cap" x="20" y="29" font-size="15" font-weight="bold" fill="#e6edf3"></text>
<g id="pic" transform="translate(0,40)"><g id="st"></g><g id="dyn"></g></g>
<g id="leg"></g>
</svg>
<script>
// Chalti tasveer ka base. Scene file (cN_anim.js) deta hai: DUR, FIX, setup(), frame(t, fix, tl).
// Ya kahani wala scene: DUR, PH, setup(), frame(ph, tl) -> har phase ka aakhri frame PNG (img/cN_k.png).
// anim_build.py ise + scene ko ek html me jodta hai, phir anim2gif.js GIF banata hai.
const NS = 'http://www.w3.org/2000/svg';
const C = { bg: '#11161c', box: '#222d3a', line: '#4b5a6a', fg: '#e6edf3', muted: '#9aa8b6',
  msg: '#64b5f6', good: '#66bb6a', bad: '#ef5350', acc: '#f0a030' };
const ST = document.getElementById('st'), DYN = document.getElementById('dyn');
function el(tag, a, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in a) e.setAttribute(k, a[k]);
  if (text !== undefined) e.textContent = text;
  (parent || ST).append(e); return e;
}
function grp(id) { return el('g', id ? { id } : {}); }
// generic line-icon (24 grid, stroke). Brand logo nahi. B(..., { icon: 'user' })
const ICON = {
  user: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 4-6 8-6s8 2 8 6',
  users: 'M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM2 20c0-3 3-5 7-5s7 2 7 5M16 5a3 3 0 0 1 0 6M18 15c2 .6 4 2 4 5',
  bucket: 'M4 6h16l-2 14H6L4 6zM4 6c0-1.7 3.6-3 8-3s8 1.3 8 3',
  db: 'M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zM4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3',
  server: 'M3 4h18v6H3zM3 14h18v6H3zM7 7h1M7 17h1',
  phone: 'M7 2h10v20H7zM11 18h2',
  chat: 'M4 4h16v12H9l-5 4V4zM8 9h8M8 12h5',
  queue: 'M3 7h4v10H3zM10 7h4v10h-4zM17 7h4v10h-4z',
  clock: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 3',
  lock: 'M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4',
  mail: 'M3 5h18v14H3zM3 5l9 7 9-7',
  cloud: 'M7 18a4 4 0 0 1 0-8 6 6 0 0 1 11.5 1.5A3.5 3.5 0 0 1 18 18H7z',
};
// dabba: label upar ki taraf, taaki beech se dot guzre to naam na dhake
function box(x, y, w, h, label, sub, o = {}) {
  const g = el('g', o.id ? { id: o.id } : {}, o.parent);
  el('rect', { x, y, width: w, height: h, rx: o.r || 8, fill: o.fill || C.box, stroke: o.stroke || C.line,
    'stroke-width': 1.5 }, g);
  let cx = x + w / 2;
  if (o.icon && ICON[o.icon]) {
    const k = 28 / 24, iy = y + (h - 28) / 2;
    el('path', { d: ICON[o.icon], transform: `translate(${x + 14},${iy}) scale(${k})`, fill: 'none',
      stroke: o.iconc || o.stroke || C.fg, 'stroke-width': 2 / k, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
    cx = x + 50 + (w - 56) / 2;
  }
  el('text', { x: cx, y: BIG ? (h >= 90 ? y + 26 : y + h / 2 + (sub ? -4 : 6)) : y + (sub || h >= 60 ? 20 : h / 2 + 5), 'text-anchor': 'middle', 'font-size': BIG ? 17 : 14, 'font-weight': BIG ? 'bold' : 'normal', fill: C.fg }, g, label);
  if (sub) el('text', { x: cx, y: BIG ? (h >= 90 ? y + 46 : y + h / 2 + 17) : y + 36, 'text-anchor': 'middle', 'font-size': BIG ? 14 : 12, fill: C.muted }, g, sub);
  return g;
}
function wire(d, id, parent) {
  return el('path', { d, id: id || '', fill: 'none', stroke: C.line, 'stroke-width': 1.5, 'stroke-dasharray': '4 4' }, parent);
}
function vis(id, on) { const e = document.getElementById(id); if (e) e.style.opacity = on ? 1 : 0; }
// har frame DYN saaf, phir naya
function T(x, y, s, o = {}) {
  return el('text', { x, y, 'text-anchor': o.a || 'middle', 'font-size': o.size || 13, fill: o.c || C.fg,
    'font-weight': o.b ? 'bold' : 'normal', 'paint-order': 'stroke', stroke: C.bg, 'stroke-width': o.halo ? 5 : 0 }, DYN, s);
}
function dot(p, c, num, label, lc) {
  if (!p) return;
  el('circle', { cx: p[0], cy: p[1], r: 9, fill: c || C.msg }, DYN);
  if (num !== undefined && num !== '') el('text', { x: p[0], y: p[1] + 4, 'text-anchor': 'middle', 'font-size': 10,
    'font-weight': 'bold', fill: C.bg }, DYN, num);
  if (label) T(p[0], p[1] - 15, label, { c: lc || c || C.msg, b: 1, size: 12, halo: 1 });
}
function cross(x, y) {
  el('path', { d: `M${x - 14} ${y - 14} L${x + 14} ${y + 14} M${x + 14} ${y - 14} L${x - 14} ${y + 14}`,
    stroke: C.bad, 'stroke-width': 4 }, DYN);
}
function lerp(a, b, f) { return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]; }
// pts: [[time, [x,y]], ...] ; pehle se pehle null, aakhir ke baad aakhri jagah
function path(pts, t) {
  if (t < pts[0][0]) return null;
  for (let i = 1; i < pts.length; i++) if (t <= pts[i][0])
    return lerp(pts[i - 1][1], pts[i][1], (t - pts[i - 1][0]) / (pts[i][0] - pts[i - 1][0]));
  return pts[pts.length - 1][1];
}
function bar(x, y, w, h, frac, label, good) {
  el('rect', { x, y, width: w, height: h, rx: 4, fill: 'none', stroke: C.line }, DYN);
  const c = good ? C.good : frac > 0.9 ? C.bad : frac > 0.6 ? C.acc : C.good;
  el('rect', { x: x + 2, y: y + 2, width: Math.max(0, (w - 4) * Math.min(1, frac)), height: h - 4, rx: 3, fill: c }, DYN);
  if (label) T(x + w / 2, y - 6, label, { size: 12, c: C.muted });
}
// list ke dabbe (inbox jaisa): items = [[text, color], ...], baayein se daayein
function cells(x, y, items, o = {}) {
  const w = o.w || 46, h = o.h || 26;
  items.forEach(([s, c], i) => {
    el('rect', { x: x + i * (w + 4), y, width: w, height: h, rx: 4, fill: C.bg, stroke: c || C.line, 'stroke-width': 1.5 }, DYN);
    T(x + i * (w + 4) + w / 2, y + h / 2 + (BIG ? 5 : 4), s, { c: c || C.fg, size: BIG ? 13 : 11, b: 1 });
  });
}
const CAP = document.getElementById('cap'), CAPBG = document.getElementById('capbg');
// kahani wale scene (PH): [[startSec, bgColor, 'DIKKAT'|'ILAAJ'|'AGAR'|'WAPAS', caption], ...] -> frame(ph, tl)
const RED = '#3a1414', GRN = '#123018', YEL = '#3a2e0a';
function B(x, y, w, h, label, sub, o = {}) {
  const m = { bad: [C.bad, '#3a1414'], good: [C.good, '#123018'], acc: [C.acc, C.box], dim: ['#33404d', '#161d25'] }[o.st] || [];
  return box(x, y, w, h, label, sub, { ...o, stroke: o.stroke || m[0], fill: o.fill || m[1], parent: DYN });
}
function A(x1, y1, x2, y2, c, o = {}) {
  c = c || C.line;
  el('line', { x1, y1, x2, y2, stroke: c, 'stroke-width': o.w || (BIG ? 2.5 : 2), 'stroke-dasharray': o.dash ? '6 5' : 'none' }, DYN);
  const a = Math.atan2(y2 - y1, x2 - x1), s = 10;
  el('path', { d: `M${x2} ${y2} L${x2 - s * Math.cos(a - 0.45)} ${y2 - s * Math.sin(a - 0.45)} ` +
    `L${x2 - s * Math.cos(a + 0.45)} ${y2 - s * Math.sin(a + 0.45)} Z`, fill: c }, DYN);
  if (o.n) { const f = o.at === undefined ? 0.5 : o.at; num(x1 + (x2 - x1) * f, y1 + (y2 - y1) * f, o.n, c); }
}
// mudi hui line (pts = [[x,y], ...]), aakhri hisse pe teer; o.n = badge sabse lambe hisse ke beech
function AP(pts, c, o = {}) {
  let best = 0, bl = -1;
  for (let i = 1; i < pts.length; i++) {
    const [a, b] = [pts[i - 1], pts[i]], l = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (l > bl) { bl = l; best = i; }
    if (i < pts.length - 1) el('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: c, 'stroke-width': o.w || 2,
      'stroke-dasharray': o.dash ? '6 5' : 'none' }, DYN);
  }
  const [p, q] = [pts[pts.length - 2], pts[pts.length - 1]];
  A(p[0], p[1], q[0], q[1], c, { dash: o.dash, w: o.w });
  if (o.n) { const [a, b] = [pts[best - 1], pts[best]], f = o.at === undefined ? 0.5 : o.at;
    num(a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, o.n, c); }
}
// kram ka gol badge (1, 2, 3 ...)
function num(x, y, n, c) {
  el('circle', { cx: x, cy: y, r: BIG ? 14 : 11, fill: c || C.muted, stroke: C.bg, 'stroke-width': 2 }, DYN);
  el('text', { x, y: y + 5, 'text-anchor': 'middle', 'font-size': BIG ? 15 : 13, 'font-weight': 'bold', fill: '#11161c' }, DYN, n);
}
// "kya hua" chhota label
function L(x, y, s, c, a) { return T(x, y, s, { c: c || C.acc, b: 1, size: BIG ? 15 : 13, halo: 1, a }); }
function dots(n, x, y, c, o = {}) {
  const cols = o.cols || 10, g = o.gap || 22;
  for (let i = 0; i < n; i++) {
    const cc = Array.isArray(c) ? c[i] : c;
    el('circle', { cx: x + (i % cols) * g, cy: y + Math.floor(i / cols) * g, r: o.r || 8,
      fill: o.hollow ? 'none' : cc, stroke: cc, 'stroke-width': 2 }, DYN);
  }
}
// NAYA SAANCHA (21-Oct, Fable + Arpan): scene me STEPS ho to 900 x 610, bade akshar, neeche patti.
// STEPS = [ [ [c, 'A -> B', 'pehli line|doosri line'], ... ] (DIKKAT), [...] (ILAAJ), [...] (AGAR) ]; c = number ka rang
let BIG = false, BIGSET = false;
function initBig() {   // draw() pe ek baar; tab tak scene ka STEPS ban chuka hota
  if (BIGSET) return; BIGSET = true;
  BIG = typeof STEPS !== 'undefined';
  if (!BIG) return;
  const R = document.getElementById('root');
  R.setAttribute('height', 610); R.setAttribute('viewBox', '0 0 900 610');
  document.getElementById('bgr').setAttribute('height', 610);
  CAPBG.setAttribute('height', 48); CAP.setAttribute('y', 31); CAP.setAttribute('font-size', 17);
  document.getElementById('pic').setAttribute('transform', 'translate(0,52)');
}
const LEG = document.getElementById('leg');
function legend(steps) {
  LEG.replaceChildren();
  if (!steps || !steps.length) return;
  const two = steps.length > 2, y0 = 418, h = two ? 178 : 100, H = y0 + h + 14;
  const R = document.getElementById('root');   // patti chhoti to tasveer bhi chhoti
  R.setAttribute('height', H); R.setAttribute('viewBox', `0 0 900 ${H}`); document.getElementById('bgr').setAttribute('height', H);
  el('rect', { x: 20, y: y0, width: 860, height: h, rx: 10, fill: '#161d25', stroke: C.line }, LEG);
  if (two) el('line', { x1: 450, y1: y0 + 14, x2: 450, y2: y0 + h - 14, stroke: C.line }, LEG);
  steps.forEach(([c, head, line], i) => {
    const col = two ? i % 2 : i, row = two ? Math.floor(i / 2) : 0;
    const x = 40 + col * 430, y = y0 + 30 + row * 82;
    el('circle', { cx: x + 14, cy: y, r: 14, fill: c }, LEG);
    el('text', { x: x + 14, y: y + 5, 'text-anchor': 'middle', 'font-size': 15, 'font-weight': 'bold', fill: '#11161c' }, LEG, i + 1);
    el('text', { x: x + 38, y: y + 6, 'font-size': 16, 'font-weight': 'bold', fill: C.fg, class: 'sans' }, LEG, head);
    String(line).split('|').forEach((ln, k) => el('text', { x: x + 38, y: y + 28 + k * 19, 'font-size': 13.5,
      fill: C.muted, class: 'sans' }, LEG, ln));
  });
}
function draw(t) {
  initBig();
  DYN.replaceChildren();
  if (typeof PH !== 'undefined') {
    let i = 0;
    while (i + 1 < PH.length && t >= PH[i + 1][0]) i++;
    CAPBG.setAttribute('fill', PH[i][1]);
    CAP.textContent = PH[i][3] || '';
    frame(i, t - PH[i][0]);
    if (BIG) legend(STEPS[i]);
    return;
  }
  const fix = t >= FIX;
  CAPBG.setAttribute('fill', fix ? '#123018' : '#3a1414');
  frame(t, fix, fix ? t - FIX : t);
}

// Card 1: feed khulte hi 200 logon ke tweet ka jod (dheema). Ilaaj: tweet hote hi follower ke inbox me id (fanout),
// movie jaisa 4 frame. Agar: inbox me sirf id -> poore tweet 50 ek saath laao (batch).
const DUR = 9;
const PH = [
  [0, RED, 'DIKKAT', 'DIKKAT: app khola. Feed ke liye har baar 200 logon ke tweet dhoondho, jodo, sort'],
  [3, GRN, 'ILAAJ', 'ILAAJ: tweet hote hi follower ke inbox me uski id (fanout). Pal-pal dekho'],
  [6, YEL, 'AGAR', 'AGAR inbox me sirf id hai, poora tweet kaise? -> 50 id ek saath laao (batch)'],
];
function setup() {}
// ek frame: upar wala dabba -> neeche wala dabba, teer kis taraf (down = upar se neeche)
function panel(k, title, top, bot, lab, down, c, note) {
  const x = 15 + k * 220;
  el('rect', { x, y: 5, width: 205, height: 265, rx: 8, fill: '#161d25', stroke: C.line }, DYN);
  num(x + 20, 25, k + 1, c); T(x + 112, 31, title, { c: C.fg, b: 1, size: 15 });
  B(x + 12, 50, 181, 58, top[0], top[1], { st: top[2] });
  B(x + 12, 160, 181, 64, bot[0], bot[1], { st: bot[2] });
  if (lab) { if (down) A(x + 60, 110, x + 60, 158, c); else A(x + 60, 158, x + 60, 110, c); } // khaali lab = teer nahi
  T(x + 72, 139, lab, { c, b: 1, size: 14, a: 'start' });
  T(x + 102, 252, note, { c: C.muted, size: 13 });
}
const STEPS = [
  [[C.msg, 'Arpan → Feed Svc', 'app khola'], [C.bad, 'Feed Svc → DB', '200 jagah se tweet laao'], [C.bad, 'Feed Svc', 'jodo + time se sort: ~2 sec'], [C.bad, 'Feed Svc → Arpan', 'feed der se. Har baar yahi']],
  [[C.msg, 'Ravi → Tweet DB', 't9 save'], [C.acc, 'Follow list → Fanout Svc', 'follower kaun: Arpan, Mohan..'], [C.good, 'Fanout Svc → Arpan ka inbox', 't9 id daali, sabke inbox me'], [C.good, 'Arpan ka inbox → Arpan', 'app khola: ek read, feed turant']],
  [[C.good, 'Arpan ka inbox → Feed Svc', '50 id'], [C.acc, 'Feed Svc → Tweet cache', 'ek call: 50 id'], [C.good, 'Tweet cache → Feed Svc', '50 tweet ek saath (batch)']],
];
function frame(ph) {
  if (ph === 0) {
    B(20, 140, 120, 60, 'Arpan', 'app khola');
    B(230, 140, 150, 60, 'Feed Svc', 'feed banao');
    B(520, 120, 170, 100, 'DB', '', { st: 'bad' });
    dots(20, 535, 160, C.bad, { cols: 10, gap: 15, r: 5 });
    T(605, 205, '200 logon ke tweet', { c: C.bad, size: 11 });
    A(140, 170, 228, 170, C.msg, { n: 1 });
    A(380, 160, 518, 160, C.bad, { n: 2 }); L(450, 140, '200 jagah se laao', C.bad);
    num(780, 150, 3, C.bad); L(780, 180, 'jodo + time se sort', C.bad); L(780, 200, '~2 sec', C.bad);
    A(228, 195, 142, 195, C.bad, { n: 4, dash: 1 }); L(185, 230, 'feed der se', C.bad);
    L(450, 320, 'aur ye har baar, jab bhi koi app khole. Padhna 50 guna hai', C.bad);
  } else if (ph === 1) {
    panel(0, 'Ravi tweet karta', ['Ravi', 'tweet: t9', ''], ['Tweet DB', 't9 save', 'acc'], 'tweet', true, C.msg, 't9 save ho gaya');
    panel(1, 'follower kaun?', ['Fanout Svc', '', 'acc'], ['Follow list', 'Arpan, Mohan..', ''], 'padha', false, C.acc, 'follower dhoondhe');
    panel(2, 'inbox me id daali', ['Fanout Svc', '', 'acc'], ['Arpan ka inbox', 't9, t7, t5 ...', 'good'], 't9 daala', true, C.good, 'Mohan, Neha.. sabke');
    panel(3, 'Arpan app kholta', ['Arpan', 'app khola', ''], ['Arpan ka inbox', 't9, t7, t5 ...', 'good'], 'ek read', false, C.good, 'feed turant');
    L(450, 320, 'mehnat tweet ke waqt ek baar. Kholne pe sirf apna inbox padho', C.good);
  } else {
    B(20, 130, 170, 70, 'Arpan ka inbox', '50 id', { st: 'good' });
    B(330, 130, 160, 70, 'Feed Svc', '');
    B(640, 120, 220, 90, 'Tweet cache', 'id -> poora tweet', { st: 'acc' });
    A(190, 165, 328, 165, C.good, { n: 1 }); L(260, 150, '50 id', C.good);
    A(490, 150, 638, 150, C.acc, { n: 2 }); L(565, 135, 'ek call: 50 id', C.acc);
    A(638, 185, 492, 185, C.good, { n: 3 }); L(565, 215, '50 tweet ek saath', C.good);
    L(450, 300, 'ek-ek laate to 50 chakkar. Batch me ek chakkar', C.good);
  }
}

setup(); draw(0);
</script>
