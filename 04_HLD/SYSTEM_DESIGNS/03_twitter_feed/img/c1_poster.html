<text x="48" y="488" font-size="14" font-weight="700" fill="#3ddc97">Kyun chalta:</text>
<text x="160" y="488" font-size="13.5" fill="#cfeee0">Padhna 50 guna hai, to mehnat likhte waqt karo, har baar khulne pe jodna mat. 2 sec purani feed chalegi, isliye pehle se banana aur cache chal jaata hai</text>
<rect x="30" y="536" width="345" height="128" rx="9" fill="#1a0f14" stroke="#ff5a6a" stroke-width="2"/>

<text x="52" y="566" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">1</text>
<text x="74" y="566" font-size="15" font-weight="700" fill="#ff5a6a">Unfollow kiya, uske tweet inbox me</text>
<text x="74" y="587" font-size="15" font-weight="700" fill="#ff5a6a">pade hain</text>
<text x="52" y="614" font-size="13.5" fill="#7fe0b0">Padhte waqt follow list se chhaanto, safai</text>
<text x="52" y="634" font-size="13.5" fill="#7fe0b0">peeche</text>
<rect x="392" y="536" width="345" height="128" rx="9" fill="#1a0f14" stroke="#ff5a6a" stroke-width="2"/>
<circle cx="414" cy="561" r="12" fill="#ff5a6a"/>
<text x="414" y="566" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">2</text>
<text x="436" y="566" font-size="15" font-weight="700" fill="#ff5a6a">Abhi Suresh ko follow kiya</text>
<text x="414" y="593" font-size="13.5" fill="#7fe0b0">Uske aakhri 20 tweet id inbox me daal do</text>
<rect x="30" y="699" width="1440" height="66" rx="9" fill="#221c08" stroke="#ffcc4d" stroke-width="2"/>
<text x="48" y="725" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>
<text x="48" y="749" font-size="13.5" fill="#e6dcb8">DB pe index ya read replica laga dete: Thoda tez hota, par har khulne pe 200 ka jod wahi ka wahi</text>
<rect x="30" y="787" width="1440" height="72" rx="9" fill="#141c2b" stroke="#3a4a63" stroke-width="2"/>
<text x="48" y="817" font-size="13.5" fill="#c9d6e8">Inbox me sirf id hai, poora tweet kaise? 50 id ek saath Tweet store se laao (batch).</text>
<text x="48" y="839" font-size="13.5" fill="#c9d6e8">Ek-ek laaye to 50 chakkar lagte</text>
