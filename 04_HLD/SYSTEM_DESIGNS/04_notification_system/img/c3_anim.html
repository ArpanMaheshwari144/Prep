<!doctype html>
<!-- banaya: tools/anim_build.py se. Badlaav scene .js me karo, ye file dobara banti hai. -->
<meta charset="utf-8">
<style>body{margin:0;background:#11161c} svg text{font-family:Consolas,"Courier New",monospace}</style>
<svg width="900" height="400" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
<rect width="900" height="400" fill="#11161c"/>
<rect id="capbg" x="0" y="0" width="900" height="44" fill="#3a1414"/>
<text id="cap" x="20" y="29" font-size="15" font-weight="bold" fill="#e6edf3"></text>
<g transform="translate(0,40)"><g id="st"></g><g id="dyn"></g></g>
</svg>
<script>
// Chalti tasveer ka base. Scene file (cN_anim.js) deta hai: DUR, FIX, setup(), frame(t, fix, tl).
// Ya kahani wala scene: DUR, PH, setup(), frame(ph, tl) -> har phase ka aakhri frame PNG (img/cN_k.png).
// anim_build.py ise + scene ko ek html me jodta hai, phir anim2gif.js GIF banata hai.
const NS = 'http://www.w3.org/2000/svg';
const C = { bg: '#11161c', box: '#222d3a', line: '#4b5a6a', fg: '#e6edf3', muted: '#9aa8b6',
  msg: '#64b5f6', good: '#66bb6a', bad: '#ef5350', acc: '#f0a030' };
const ST = document.getElementById('st'), DYN = document.getElementById('dyn');
function el(tag, a, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in a) e.setAttribute(k, a[k]);
  if (text !== undefined) e.textContent = text;
  (parent || ST).append(e); return e;
}
function grp(id) { return el('g', id ? { id } : {}); }
// dabba: label upar ki taraf, taaki beech se dot guzre to naam na dhake
function box(x, y, w, h, label, sub, o = {}) {
  const g = el('g', o.id ? { id: o.id } : {}, o.parent);
  el('rect', { x, y, width: w, height: h, rx: o.r || 8, fill: o.fill || C.box, stroke: o.stroke || C.line,
    'stroke-width': 1.5 }, g);
  el('text', { x: x + w / 2, y: y + (sub || h >= 60 ? 20 : h / 2 + 5), 'text-anchor': 'middle', 'font-size': 14, fill: C.fg }, g, label);
  if (sub) el('text', { x: x + w / 2, y: y + 36, 'text-anchor': 'middle', 'font-size': 12, fill: C.muted }, g, sub);
  return g;
}
function wire(d, id, parent) {
  return el('path', { d, id: id || '', fill: 'none', stroke: C.line, 'stroke-width': 1.5, 'stroke-dasharray': '4 4' }, parent);
}
function vis(id, on) { const e = document.getElementById(id); if (e) e.style.opacity = on ? 1 : 0; }
// har frame DYN saaf, phir naya
function T(x, y, s, o = {}) {
  return el('text', { x, y, 'text-anchor': o.a || 'middle', 'font-size': o.size || 13, fill: o.c || C.fg,
    'font-weight': o.b ? 'bold' : 'normal', 'paint-order': 'stroke', stroke: C.bg, 'stroke-width': o.halo ? 5 : 0 }, DYN, s);
}
function dot(p, c, num, label, lc) {
  if (!p) return;
  el('circle', { cx: p[0], cy: p[1], r: 9, fill: c || C.msg }, DYN);
  if (num !== undefined && num !== '') el('text', { x: p[0], y: p[1] + 4, 'text-anchor': 'middle', 'font-size': 10,
    'font-weight': 'bold', fill: C.bg }, DYN, num);
  if (label) T(p[0], p[1] - 15, label, { c: lc || c || C.msg, b: 1, size: 12, halo: 1 });
}
function cross(x, y) {
  el('path', { d: `M${x - 14} ${y - 14} L${x + 14} ${y + 14} M${x + 14} ${y - 14} L${x - 14} ${y + 14}`,
    stroke: C.bad, 'stroke-width': 4 }, DYN);
}
function lerp(a, b, f) { return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]; }
// pts: [[time, [x,y]], ...] ; pehle se pehle null, aakhir ke baad aakhri jagah
function path(pts, t) {
  if (t < pts[0][0]) return null;
  for (let i = 1; i < pts.length; i++) if (t <= pts[i][0])
    return lerp(pts[i - 1][1], pts[i][1], (t - pts[i - 1][0]) / (pts[i][0] - pts[i - 1][0]));
  return pts[pts.length - 1][1];
}
function bar(x, y, w, h, frac, label, good) {
  el('rect', { x, y, width: w, height: h, rx: 4, fill: 'none', stroke: C.line }, DYN);
  const c = good ? C.good : frac > 0.9 ? C.bad : frac > 0.6 ? C.acc : C.good;
  el('rect', { x: x + 2, y: y + 2, width: Math.max(0, (w - 4) * Math.min(1, frac)), height: h - 4, rx: 3, fill: c }, DYN);
  if (label) T(x + w / 2, y - 6, label, { size: 12, c: C.muted });
}
// list ke dabbe (inbox jaisa): items = [[text, color], ...], baayein se daayein
function cells(x, y, items, o = {}) {
  const w = o.w || 46, h = o.h || 26;
  items.forEach(([s, c], i) => {
    el('rect', { x: x + i * (w + 4), y, width: w, height: h, rx: 4, fill: C.bg, stroke: c || C.line, 'stroke-width': 1.5 }, DYN);
    T(x + i * (w + 4) + w / 2, y + h / 2 + 4, s, { c: c || C.fg, size: 11, b: 1 });
  });
}
const CAP = document.getElementById('cap'), CAPBG = document.getElementById('capbg');
// kahani wale scene (PH): [[startSec, bgColor, 'DIKKAT'|'ILAAJ'|'AGAR'|'WAPAS', caption], ...] -> frame(ph, tl)
const RED = '#3a1414', GRN = '#123018', YEL = '#3a2e0a';
function B(x, y, w, h, label, sub, o = {}) {
  const m = { bad: [C.bad, '#3a1414'], good: [C.good, '#123018'], acc: [C.acc, C.box], dim: ['#33404d', '#161d25'] }[o.st] || [];
  return box(x, y, w, h, label, sub, { ...o, stroke: o.stroke || m[0], fill: o.fill || m[1], parent: DYN });
}
function A(x1, y1, x2, y2, c, o = {}) {
  c = c || C.line;
  el('line', { x1, y1, x2, y2, stroke: c, 'stroke-width': o.w || 2, 'stroke-dasharray': o.dash ? '6 5' : 'none' }, DYN);
  const a = Math.atan2(y2 - y1, x2 - x1), s = 10;
  el('path', { d: `M${x2} ${y2} L${x2 - s * Math.cos(a - 0.45)} ${y2 - s * Math.sin(a - 0.45)} ` +
    `L${x2 - s * Math.cos(a + 0.45)} ${y2 - s * Math.sin(a + 0.45)} Z`, fill: c }, DYN);
  if (o.n) { const f = o.at === undefined ? 0.5 : o.at; num(x1 + (x2 - x1) * f, y1 + (y2 - y1) * f, o.n, c); }
}
// mudi hui line (pts = [[x,y], ...]), aakhri hisse pe teer; o.n = badge sabse lambe hisse ke beech
function AP(pts, c, o = {}) {
  let best = 0, bl = -1;
  for (let i = 1; i < pts.length; i++) {
    const [a, b] = [pts[i - 1], pts[i]], l = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (l > bl) { bl = l; best = i; }
    if (i < pts.length - 1) el('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: c, 'stroke-width': o.w || 2,
      'stroke-dasharray': o.dash ? '6 5' : 'none' }, DYN);
  }
  const [p, q] = [pts[pts.length - 2], pts[pts.length - 1]];
  A(p[0], p[1], q[0], q[1], c, { dash: o.dash, w: o.w });
  if (o.n) { const [a, b] = [pts[best - 1], pts[best]], f = o.at === undefined ? 0.5 : o.at;
    num(a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, o.n, c); }
}
// kram ka gol badge (1, 2, 3 ...)
function num(x, y, n, c) {
  el('circle', { cx: x, cy: y, r: 11, fill: c || C.muted, stroke: C.bg, 'stroke-width': 2 }, DYN);
  el('text', { x, y: y + 4.5, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 'bold', fill: '#11161c' }, DYN, n);
}
// "kya hua" chhota label
function L(x, y, s, c, a) { return T(x, y, s, { c: c || C.acc, b: 1, size: 13, halo: 1, a }); }
function dots(n, x, y, c, o = {}) {
  const cols = o.cols || 10, g = o.gap || 22;
  for (let i = 0; i < n; i++) {
    const cc = Array.isArray(c) ? c[i] : c;
    el('circle', { cx: x + (i % cols) * g, cy: y + Math.floor(i / cols) * g, r: o.r || 8,
      fill: o.hollow ? 'none' : cc, stroke: cc, 'stroke-width': 2 }, DYN);
  }
}
function draw(t) {
  DYN.replaceChildren();
  if (typeof PH !== 'undefined') {
    let i = 0;
    while (i + 1 < PH.length && t >= PH[i + 1][0]) i++;
    CAPBG.setAttribute('fill', PH[i][1]);
    CAP.textContent = PH[i][3] || '';
    frame(i, t - PH[i][0]);
    return;
  }
  const fix = t >= FIX;
  CAPBG.setAttribute('fill', fix ? '#123018' : '#3a1414');
  frame(t, fix, fix ? t - FIX : t);
}

// Card 3: Worker-A ne email bheja, "padh liya" se pehle mara, Worker-B ne phir bheja -> 2 email.
// Ilaaj: khabar ki key (khabar_id + raasta) Redis me. Agar: Redis gira, key 24 ghante me mit gayi. Wapas: Redis + DB.
const DUR = 15;
const PH = [
  [0, RED, 'DIKKAT', 'DIKKAT: Worker-A ne email bheja, "padh liya" se pehle mara. B ne phir bheja'],
  [3, GRN, 'ILAAJ', 'ILAAJ: bhejne se pehle key (khabar_id + raasta) Redis me. Mili to skip'],
  [6, YEL, 'AGAR', 'AGAR key wala Redis gir gaya? -> DB me (khabar_id, raasta) UNIQUE rokta'],
  [9, YEL, 'AGAR', 'AGAR Redis ki key 24 ghante me mit gayi? -> DB ki row nahi bhoolti'],
  [12, GRN, 'WAPAS', 'WAPAS: Redis tez raasta, DB aakhri deewar. Dobara aayi khabar skip'],
];
function setup() {}
function base(o = {}) {
  B(20, 150, 120, 80, 'Kafka', 'khabar K-1');
  B(290, 50, 140, 70, 'Worker-A', '', { st: o.a }); B(290, 240, 140, 70, 'Worker-B', '', { st: o.b });
  B(730, 150, 130, 80, 'User', o.mails, { st: o.u });
  if (o.redis !== undefined) B(510, 140, 140, 70, 'Redis', o.redis, { st: o.rst });
  if (o.db !== undefined) B(510, 270, 140, 60, 'DB', o.db, { st: o.dbst });
}
function aDead(n) { num(275, 30, n, C.bad); L(293, 35, 'mara, "padh liya" nahi bola', C.bad, 'start'); cross(268, 62); }
function frame(ph) {
  if (ph === 0) {
    base({ a: 'bad', b: 'bad', u: 'bad', mails: 'email: 2' });
    A(140, 175, 288, 90, C.msg, { n: 1, at: 0.5 });
    A(430, 85, 728, 175, C.msg, { n: 2, at: 0.5 });
    aDead(3);
    A(140, 205, 288, 270, C.acc, { n: 4, at: 0.5 }); L(150, 270, 'khabar dobara', C.acc, 'start');
    A(430, 275, 728, 205, C.bad, { n: 5, at: 0.5 });
  } else if (ph === 1) {
    base({ a: 'bad', b: 'good', u: 'good', mails: 'email: 1', redis: 'K-1:email', rst: 'acc' });
    A(140, 175, 288, 90, C.msg, { n: 1, at: 0.5 });
    A(430, 95, 508, 160, C.acc, { n: 2, at: 0.5 }); L(515, 232, 'nahi mili -> likha', C.acc, 'start');
    A(430, 62, 728, 160, C.good, { n: 3, at: 0.45 });
    aDead(4);
    A(140, 205, 288, 270, C.acc, { n: 5, at: 0.5 }); L(150, 270, 'khabar dobara', C.acc, 'start');
    A(430, 260, 508, 195, C.acc, { n: 6, at: 0.5 }); L(440, 330, 'key mili -> skip', C.good, 'start');
  } else if (ph === 2) {
    base({ b: 'good', u: 'good', mails: 'email: 1', redis: 'gira', rst: 'bad', db: 'K-1, email', dbst: 'acc' });
    cross(675, 175); num(675, 130, 1, C.bad); L(693, 135, 'gira', C.bad, 'start');
    A(430, 75, 728, 165, C.line);
    A(140, 205, 288, 270, C.acc, { n: 2, at: 0.5 }); L(150, 270, 'khabar dobara', C.acc, 'start');
    A(430, 285, 508, 290, C.acc, { n: 3, at: 0.5 }); L(470, 270, 'likho', C.acc);
    A(508, 315, 432, 305, C.bad, { n: 4, at: 0.5 }); L(440, 340, 'pehle se hai -> skip', C.good, 'start');
    L(450, 25, 'hal: DB me (khabar_id, raasta) UNIQUE, ek hi baar lagta', C.good);
  } else if (ph === 3) {
    base({ b: 'good', u: 'good', mails: 'email: 1', redis: 'K-1: mit gayi', rst: 'acc', db: 'K-1, email', dbst: 'good' });
    num(675, 130, 1, C.acc); L(693, 135, '24 ghante baad', C.acc, 'start');
    A(430, 75, 728, 165, C.line);
    A(140, 205, 288, 270, C.acc, { n: 2, at: 0.5 }); L(150, 270, 'khabar dobara', C.acc, 'start');
    A(430, 255, 508, 195, C.acc, { n: 3, at: 0.5 }); L(520, 230, 'key nahi', C.acc, 'start');
    A(430, 285, 508, 290, C.acc, { n: 4, at: 0.5 });
    A(508, 315, 432, 305, C.good, { n: 5, at: 0.5 }); L(440, 340, 'row hai -> skip', C.good, 'start');
    L(450, 25, 'hal: DB ki row nahi bhoolti, wo phir bhi rokegi', C.good);
  } else {
    base({ b: 'good', u: 'good', mails: 'email: 1', redis: 'tez raasta', rst: 'good', db: 'aakhri deewar', dbst: 'good' });
    A(430, 75, 728, 165, C.line);
    A(140, 205, 288, 270, C.acc, { n: 1, at: 0.5 }); L(150, 270, 'khabar dobara', C.acc, 'start');
    A(430, 260, 508, 195, C.good, { n: 2, at: 0.5 }); L(520, 230, 'key mili -> skip', C.good, 'start');
    A(430, 300, 508, 300, C.line, { dash: 1 });
  }
}

setup(); draw(0);
</script>
