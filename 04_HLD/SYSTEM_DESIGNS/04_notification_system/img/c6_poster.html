<text x="30" y="40" font-size="26" font-weight="700" fill="#e6edf3">Card 6: 2-3 sec me chhodo (timeout). Baar-baar fail to breaker khula, OTP doosri company (SNS) se</text>
<text x="30" y="68" font-size="15" fill="#9fb0c8">Laal number = yahan toot sakta hai, neeche usi number pe: laal = kya hua, hara = kaise bacha</text>
<rect x="30" y="84" width="1440" height="44" rx="9" fill="#1f1418" stroke="#8a4a55" stroke-width="2"/>
<text x="48" y="110" font-size="14" font-weight="700" fill="#ff8a95">Pehle aisa tha:</text>
<text x="170" y="110" font-size="13.5" fill="#d9b8bd">Har call 30 sec tak intezaar. Saare SMS worker Twilio pe phanse, OTP bhi ruka</text>
<rect x="30" y="226" width="250" height="130" rx="12" fill="#0f2a22" stroke="#3ddc97" stroke-width="2.5"/>
<text x="155.0" y="260" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle">SMS worker</text>
<text x="155.0" y="286" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">2-3 sec me chhodo</text>
<text x="155.0" y="308" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">(timeout)</text>

<text x="495.0" y="283" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">Twilio ko call band</text>
<text x="495.0" y="305" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">thodi der baad</text>
<text x="495.0" y="327" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">ek test call</text>

<text x="48" y="546" font-size="14" font-weight="700" fill="#3ddc97">Kyun chalta:</text>
<text x="160" y="546" font-size="13.5" fill="#cfeee0">Dheema matlab band maano. Har company ka apna circuit breaker, to uske band hone se baaki raaste chalte rehte. Khabar line me rukti hai, phenki nahi jaati</text>
<rect x="30" y="594" width="345" height="120" rx="9" fill="#1a0f14" stroke="#ff5a6a" stroke-width="2"/>
<circle cx="52" cy="619" r="12" fill="#ff5a6a"/>
<text x="52" y="624" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">1</text>
<text x="74" y="624" font-size="15" font-weight="700" fill="#ff5a6a">SNS bhi band ho gaya</text>
<text x="52" y="651" font-size="13.5" fill="#7fe0b0">Khabar line me rukti, phenko nahi. Backoff</text>
<text x="52" y="671" font-size="13.5" fill="#7fe0b0">se koshish + OTP ka alert</text>
<rect x="392" y="594" width="345" height="120" rx="9" fill="#1a0f14" stroke="#ff5a6a" stroke-width="2"/>
<circle cx="414" cy="619" r="12" fill="#ff5a6a"/>
<text x="414" y="624" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">2</text>
<text x="436" y="624" font-size="15" font-weight="700" fill="#ff5a6a">Twilio dheemi (dheema = band maano)</text>
<text x="414" y="651" font-size="13.5" fill="#7fe0b0">Breaker khula, OTP SNS se. Test call theek</text>
<text x="414" y="671" font-size="13.5" fill="#7fe0b0">aayi to Twilio wapas</text>
<rect x="30" y="749" width="1440" height="66" rx="9" fill="#221c08" stroke="#ffcc4d" stroke-width="2"/>
<text x="48" y="775" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>
<text x="48" y="799" font-size="13.5" fill="#e6dcb8">Worker badha do: Naye worker bhi 30 sec me phanse, Twilio pe aur bojh</text>
<rect x="30" y="837" width="1440" height="72" rx="9" fill="#141c2b" stroke="#3a4a63" stroke-width="2"/>
<text x="48" y="867" font-size="13.5" fill="#c9d6e8">Breaker kahan? Har process ka apna (Resilience4j), ya Redis me saanjha. Har company ka apna, Twilio khula to push / email chalte.</text>
<text x="48" y="889" font-size="13.5" fill="#c9d6e8">Push bhi doosri company se? Nahi: Android = FCM, iPhone = APNs, phone ka OS tay karta</text>
