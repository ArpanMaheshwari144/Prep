<!doctype html>
<!-- banaya: tools/anim_build.py se. Badlaav scene .js me karo, ye file dobara banti hai. -->
<meta charset="utf-8">
<style>body{margin:0;background:#11161c} svg text{font-family:Consolas,"Courier New",monospace}</style>
<svg width="900" height="400" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
<rect width="900" height="400" fill="#11161c"/>
<rect id="capbg" x="0" y="0" width="900" height="44" fill="#3a1414"/>
<text id="cap" x="20" y="29" font-size="15" font-weight="bold" fill="#e6edf3"></text>
<g transform="translate(0,40)"><g id="st"></g><g id="dyn"></g></g>
</svg>
<script>
// Chalti tasveer ka base. Scene file (cN_anim.js) deta hai: DUR, FIX, setup(), frame(t, fix, tl).
// Ya kahani wala scene: DUR, PH, setup(), frame(ph, tl) -> har phase ka aakhri frame PNG (img/cN_k.png).
// anim_build.py ise + scene ko ek html me jodta hai, phir anim2gif.js GIF banata hai.
const NS = 'http://www.w3.org/2000/svg';
const C = { bg: '#11161c', box: '#222d3a', line: '#4b5a6a', fg: '#e6edf3', muted: '#9aa8b6',
  msg: '#64b5f6', good: '#66bb6a', bad: '#ef5350', acc: '#f0a030' };
const ST = document.getElementById('st'), DYN = document.getElementById('dyn');
function el(tag, a, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in a) e.setAttribute(k, a[k]);
  if (text !== undefined) e.textContent = text;
  (parent || ST).append(e); return e;
}
function grp(id) { return el('g', id ? { id } : {}); }
// dabba: label upar ki taraf, taaki beech se dot guzre to naam na dhake
function box(x, y, w, h, label, sub, o = {}) {
  const g = el('g', o.id ? { id: o.id } : {}, o.parent);
  el('rect', { x, y, width: w, height: h, rx: o.r || 8, fill: o.fill || C.box, stroke: o.stroke || C.line,
    'stroke-width': 1.5 }, g);
  el('text', { x: x + w / 2, y: y + (sub || h >= 60 ? 20 : h / 2 + 5), 'text-anchor': 'middle', 'font-size': 14, fill: C.fg }, g, label);
  if (sub) el('text', { x: x + w / 2, y: y + 36, 'text-anchor': 'middle', 'font-size': 12, fill: C.muted }, g, sub);
  return g;
}
function wire(d, id, parent) {
  return el('path', { d, id: id || '', fill: 'none', stroke: C.line, 'stroke-width': 1.5, 'stroke-dasharray': '4 4' }, parent);
}
function vis(id, on) { const e = document.getElementById(id); if (e) e.style.opacity = on ? 1 : 0; }
// har frame DYN saaf, phir naya
function T(x, y, s, o = {}) {
  return el('text', { x, y, 'text-anchor': o.a || 'middle', 'font-size': o.size || 13, fill: o.c || C.fg,
    'font-weight': o.b ? 'bold' : 'normal', 'paint-order': 'stroke', stroke: C.bg, 'stroke-width': o.halo ? 5 : 0 }, DYN, s);
}
function dot(p, c, num, label, lc) {
  if (!p) return;
  el('circle', { cx: p[0], cy: p[1], r: 9, fill: c || C.msg }, DYN);
  if (num !== undefined && num !== '') el('text', { x: p[0], y: p[1] + 4, 'text-anchor': 'middle', 'font-size': 10,
    'font-weight': 'bold', fill: C.bg }, DYN, num);
  if (label) T(p[0], p[1] - 15, label, { c: lc || c || C.msg, b: 1, size: 12, halo: 1 });
}
function cross(x, y) {
  el('path', { d: `M${x - 14} ${y - 14} L${x + 14} ${y + 14} M${x + 14} ${y - 14} L${x - 14} ${y + 14}`,
    stroke: C.bad, 'stroke-width': 4 }, DYN);
}
function lerp(a, b, f) { return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]; }
// pts: [[time, [x,y]], ...] ; pehle se pehle null, aakhir ke baad aakhri jagah
function path(pts, t) {
  if (t < pts[0][0]) return null;
  for (let i = 1; i < pts.length; i++) if (t <= pts[i][0])
    return lerp(pts[i - 1][1], pts[i][1], (t - pts[i - 1][0]) / (pts[i][0] - pts[i - 1][0]));
  return pts[pts.length - 1][1];
}
function bar(x, y, w, h, frac, label, good) {
  el('rect', { x, y, width: w, height: h, rx: 4, fill: 'none', stroke: C.line }, DYN);
  const c = good ? C.good : frac > 0.9 ? C.bad : frac > 0.6 ? C.acc : C.good;
  el('rect', { x: x + 2, y: y + 2, width: Math.max(0, (w - 4) * Math.min(1, frac)), height: h - 4, rx: 3, fill: c }, DYN);
  if (label) T(x + w / 2, y - 6, label, { size: 12, c: C.muted });
}
// list ke dabbe (inbox jaisa): items = [[text, color], ...], baayein se daayein
function cells(x, y, items, o = {}) {
  const w = o.w || 46, h = o.h || 26;
  items.forEach(([s, c], i) => {
    el('rect', { x: x + i * (w + 4), y, width: w, height: h, rx: 4, fill: C.bg, stroke: c || C.line, 'stroke-width': 1.5 }, DYN);
    T(x + i * (w + 4) + w / 2, y + h / 2 + 4, s, { c: c || C.fg, size: 11, b: 1 });
  });
}
const CAP = document.getElementById('cap'), CAPBG = document.getElementById('capbg');
// kahani wale scene (PH): [[startSec, bgColor, 'DIKKAT'|'ILAAJ'|'AGAR'|'WAPAS', caption], ...] -> frame(ph, tl)
const RED = '#3a1414', GRN = '#123018', YEL = '#3a2e0a';
function B(x, y, w, h, label, sub, o = {}) {
  const m = { bad: [C.bad, '#3a1414'], good: [C.good, '#123018'], acc: [C.acc, C.box], dim: ['#33404d', '#161d25'] }[o.st] || [];
  return box(x, y, w, h, label, sub, { ...o, stroke: o.stroke || m[0], fill: o.fill || m[1], parent: DYN });
}
function A(x1, y1, x2, y2, c, o = {}) {
  c = c || C.line;
  el('line', { x1, y1, x2, y2, stroke: c, 'stroke-width': o.w || 2, 'stroke-dasharray': o.dash ? '6 5' : 'none' }, DYN);
  const a = Math.atan2(y2 - y1, x2 - x1), s = 10;
  el('path', { d: `M${x2} ${y2} L${x2 - s * Math.cos(a - 0.45)} ${y2 - s * Math.sin(a - 0.45)} ` +
    `L${x2 - s * Math.cos(a + 0.45)} ${y2 - s * Math.sin(a + 0.45)} Z`, fill: c }, DYN);
  if (o.n) { const f = o.at === undefined ? 0.5 : o.at; num(x1 + (x2 - x1) * f, y1 + (y2 - y1) * f, o.n, c); }
}
// mudi hui line (pts = [[x,y], ...]), aakhri hisse pe teer; o.n = badge sabse lambe hisse ke beech
function AP(pts, c, o = {}) {
  let best = 0, bl = -1;
  for (let i = 1; i < pts.length; i++) {
    const [a, b] = [pts[i - 1], pts[i]], l = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (l > bl) { bl = l; best = i; }
    if (i < pts.length - 1) el('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: c, 'stroke-width': o.w || 2,
      'stroke-dasharray': o.dash ? '6 5' : 'none' }, DYN);
  }
  const [p, q] = [pts[pts.length - 2], pts[pts.length - 1]];
  A(p[0], p[1], q[0], q[1], c, { dash: o.dash, w: o.w });
  if (o.n) { const [a, b] = [pts[best - 1], pts[best]], f = o.at === undefined ? 0.5 : o.at;
    num(a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, o.n, c); }
}
// kram ka gol badge (1, 2, 3 ...)
function num(x, y, n, c) {
  el('circle', { cx: x, cy: y, r: 11, fill: c || C.muted, stroke: C.bg, 'stroke-width': 2 }, DYN);
  el('text', { x, y: y + 4.5, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 'bold', fill: '#11161c' }, DYN, n);
}
// "kya hua" chhota label
function L(x, y, s, c, a) { return T(x, y, s, { c: c || C.acc, b: 1, size: 13, halo: 1, a }); }
function dots(n, x, y, c, o = {}) {
  const cols = o.cols || 10, g = o.gap || 22;
  for (let i = 0; i < n; i++) {
    const cc = Array.isArray(c) ? c[i] : c;
    el('circle', { cx: x + (i % cols) * g, cy: y + Math.floor(i / cols) * g, r: o.r || 8,
      fill: o.hollow ? 'none' : cc, stroke: cc, 'stroke-width': 2 }, DYN);
  }
}
function draw(t) {
  DYN.replaceChildren();
  if (typeof PH !== 'undefined') {
    let i = 0;
    while (i + 1 < PH.length && t >= PH[i + 1][0]) i++;
    CAPBG.setAttribute('fill', PH[i][1]);
    CAP.textContent = PH[i][3] || '';
    frame(i, t - PH[i][0]);
    return;
  }
  const fix = t >= FIX;
  CAPBG.setAttribute('fill', fix ? '#123018' : '#3a1414');
  frame(t, fix, fix ? t - FIX : t);
}

// Card 1: Order Svc seedha email company ko call kare, company band -> order fail. Ilaaj: outbox + relay -> Kafka.
// Agar: service Kafka se pehle giri, traffic 10 guna, company band, Notification Svc dheemi. Wapas: company aayi.
const DUR = 21;
const PH = [
  [0, RED, 'DIKKAT', 'DIKKAT: Order Svc seedha email company ko call kare. Band -> order fail'],
  [3, GRN, 'ILAAJ', 'ILAAJ: order + khabar ek DB txn (outbox), relay Kafka me. Order turant OK'],
  [6, YEL, 'AGAR', 'AGAR Kafka tak pahunchne se pehle service giri? -> khabar outbox me padi'],
  [9, YEL, 'AGAR', 'AGAR traffic achanak 10 guna? -> jhatka Kafka ki line sambhaalti'],
  [12, YEL, 'AGAR', 'AGAR email company band? -> khabar Kafka ke log me ~7 din padi'],
  [15, YEL, 'AGAR', 'AGAR Notification Svc dheemi? -> machine badhao (consumer group)'],
  [18, GRN, 'WAPAS', 'WAPAS: company 2 din baad wapas aayi -> wahin se aage chala'],
];
function setup() {}
// o: { user, ord, db, kf, ns, em } = box st ; sub = { db, kf, ns, em }
function base(o = {}, sub = {}) {
  B(20, 150, 100, 70, 'User', 'order kiya', { st: o.user });
  B(170, 150, 130, 70, 'Order Svc', '', { st: o.ord });
  B(700, 150, 150, 70, 'Email co.', sub.em || 'company', { st: o.em });
  if (o.noOut) return;
  B(170, 280, 130, 60, 'DB', sub.db || 'order + outbox', { st: o.db });
  B(350, 150, 110, 70, 'Kafka', sub.kf || 'log', { st: o.kf });
  if (!o.noNs) B(500, 150, 160, 70, 'Notification Svc', sub.ns || 'peeche padhe', { st: o.ns });
}
function frame(ph) {
  if (ph === 0) {
    base({ noOut: 1, em: 'bad', user: 'bad' }, { em: 'band' });
    cross(872, 185); num(745, 128, 1, C.bad); L(762, 133, 'company band', C.bad, 'start');
    A(120, 172, 168, 172, C.msg, { n: 2, at: 0.45 });
    A(300, 172, 698, 172, C.msg, { n: 3 }); L(500, 150, 'email bhejo, jawab ka intezaar', C.msg);
    A(698, 200, 302, 200, C.bad, { n: 4 }); L(500, 230, 'error', C.bad);
    A(168, 200, 122, 200, C.bad, { n: 5, at: 0.5 }); L(70, 250, 'order FAIL', C.bad);
  } else if (ph === 1) {
    base({ db: 'acc', kf: 'acc', ns: 'acc', em: 'good', user: 'good' });
    A(120, 172, 168, 172, C.msg, { n: 1, at: 0.45 });
    A(235, 222, 235, 278, C.acc, { n: 2 }); L(220, 260, 'ek txn: order + khabar', C.acc, 'end');
    A(168, 200, 122, 200, C.good, { n: 3, at: 0.5 }); L(70, 135, 'order OK turant', C.good);
    A(300, 310, 400, 222, C.acc, { n: 4, at: 0.55 }); L(318, 336, 'relay Kafka me daale', C.acc, 'start');
    A(460, 185, 498, 185, C.msg, { n: 5 }); L(480, 135, 'padhe', C.msg);
    A(660, 185, 698, 185, C.good, { n: 6 }); L(775, 250, 'email gaya', C.good);
  } else if (ph === 2) {
    base({ ord: 'bad', db: 'acc', kf: 'acc', ns: 'acc', em: 'good' }, { db: 'khabar padi' });
    A(120, 172, 168, 172, C.line);
    A(235, 222, 235, 278, C.acc, { n: 1 }); L(252, 255, 'ek txn likha', C.acc, 'start');
    num(185, 132, 2, C.bad); L(203, 137, 'gira', C.bad, 'start'); cross(270, 128);
    A(300, 310, 400, 222, C.acc, { n: 3, at: 0.55 }); L(318, 336, 'relay baad me bhejta', C.acc, 'start');
    A(460, 185, 498, 185, C.msg, { n: 4 });
    A(660, 185, 698, 185, C.good, { n: 5 }); L(775, 250, 'email gaya', C.good);
    L(500, 40, 'hal: khabar outbox ki row me, relay baad me bhejta, khoti nahi', C.good);
  } else if (ph === 3) {
    base({ user: 'bad', kf: 'acc', ns: 'good', em: 'good' }, { kf: 'line bhari', ns: 'apni speed' });
    dots(6, 30, 118, C.bad, { gap: 18 }); num(16, 92, 1, C.bad); L(34, 97, '10 guna', C.bad, 'start');
    A(120, 185, 168, 185, C.bad, { n: 2, at: 0.45 });
    A(300, 185, 348, 185, C.msg, { n: 3, at: 0.45 });
    dots(6, 357, 125, C.msg, { gap: 18 }); L(405, 103, 'line me ruki', C.acc);
    A(460, 185, 498, 185, C.good, { n: 4 }); L(580, 135, 'apni speed se', C.good);
    A(660, 185, 698, 185, C.good, { n: 5 });
    L(500, 40, 'hal: jhatka line sambhaalti, worker apni speed se', C.good);
    L(500, 62, 'sale 12 baje -> 11:50 tak worker badha do', C.good);
  } else if (ph === 4) {
    base({ user: 'good', kf: 'acc', ns: 'acc', em: 'bad' }, { kf: 'khabar padi', em: 'band' });
    cross(872, 185); num(745, 128, 1, C.bad); L(762, 133, 'band', C.bad, 'start');
    A(120, 172, 168, 172, C.line); A(300, 310, 400, 222, C.line);
    A(168, 200, 122, 200, C.good, { n: 4, at: 0.5 });
    A(660, 185, 698, 185, C.bad, { n: 2, dash: 1 }); L(680, 245, 'fail, ruko', C.bad);
    dots(4, 370, 255, C.acc, { gap: 22 }); num(352, 290, 3, C.acc); L(370, 295, '~7 din padi', C.acc, 'start');
    L(70, 250, 'order OK turant', C.good);
    L(500, 40, 'hal: Kafka me padi, offset yaad rakhta kahan tak padha', C.good);
  } else if (ph === 5) {
    B(20, 150, 100, 70, 'User', 'order kiya'); B(170, 150, 130, 70, 'Order Svc');
    B(170, 280, 130, 60, 'DB', 'order + outbox'); B(700, 150, 150, 70, 'Email co.', 'company', { st: 'good' });
    B(350, 150, 110, 70, 'Kafka', 'line 1, 2, 3', { st: 'acc' });
    B(510, 40, 140, 60, 'Notif Svc 2', 'nayi', { st: 'good' });
    B(510, 155, 140, 60, 'Notif Svc 1', 'dheemi', { st: 'acc' });
    B(510, 270, 140, 60, 'Notif Svc 3', 'nayi', { st: 'good' });
    A(120, 185, 168, 185, C.line); A(300, 185, 348, 185, C.line); A(300, 310, 400, 222, C.line);
    num(636, 173, 1, C.acc); num(636, 58, 2, C.good); num(636, 288, 2, C.good);
    A(460, 165, 508, 75, C.msg, { n: 3, at: 0.45 }); A(460, 185, 508, 185, C.msg);
    A(460, 205, 508, 295, C.msg, { n: 3, at: 0.45 });
    A(650, 70, 698, 165, C.good, { n: 4, at: 0.5 }); A(650, 185, 698, 185, C.good);
    A(650, 300, 698, 205, C.good, { n: 4, at: 0.5 });
    L(700, 40, 'hal: har line ek machine,', C.good, 'start'); L(700, 60, 'lines bat jaati', C.good, 'start');
  } else {
    base({ user: 'good', kf: 'acc', ns: 'good', em: 'good' }, { kf: 'offset yaad', em: 'wapas' });
    num(745, 128, 1, C.good); L(762, 133, 'wapas aaya', C.good, 'start');
    A(120, 172, 168, 172, C.line); A(300, 310, 400, 222, C.line);
    A(460, 185, 498, 185, C.good, { n: 2 }); L(480, 135, 'wahin se', C.good);
    A(660, 185, 698, 185, C.good, { n: 3 }); L(775, 250, 'email gaya', C.good);
    L(70, 250, 'order OK', C.good);
  }
}

setup(); draw(0);
</script>
