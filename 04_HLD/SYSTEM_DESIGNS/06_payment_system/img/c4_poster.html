<text x="52" y="592" font-size="15" font-weight="700" fill="#c9d6e8">Call gayi hi nahi (circuit OPEN) = saaf &#x27;abhi nahi&#x27;, paisa hila nahi. 30 sec baad test call: chali to band, nahi to phir OPEN.</text>
