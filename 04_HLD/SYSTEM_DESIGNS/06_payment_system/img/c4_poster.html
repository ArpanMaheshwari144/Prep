<text x="30" y="40" font-size="26" font-weight="700" fill="#e6edf3">Card 4: bank 2-3 sec me na bole to PENDING, &#x27;fail&#x27; nahi. Baar-baar fail = breaker khula, turant &#x27;abhi nahi&#x27;</text>
<text x="30" y="68" font-size="15" fill="#9fb0c8">Laal number = yahan toot sakta hai, neeche usi number pe: laal = kya hua, hara = kaise bacha</text>
<rect x="1330" y="50" width="140" height="28" rx="14" fill="#2a1a10" stroke="#ffa94d" stroke-width="2"/>
<text x="1400" y="69" font-size="14" font-weight="700" fill="#ffa94d" text-anchor="middle">card 4 / 10</text>
<rect x="30" y="84" width="1440" height="46" rx="9" fill="#111a2a" stroke="#33425a" stroke-width="2"/>
<text x="48" y="113" font-size="15" font-weight="700" fill="#9fb0c8">Peeche:</text>
<text x="118" y="113" font-size="14.5" fill="#c9d6e8">card 3 me payment ki apni key, retry pe wahi</text>
<text x="760" y="113" font-size="15" font-weight="700" fill="#ff8a95">Ab:</text>
<text x="796" y="113" font-size="14.5" fill="#f0d4d8">Arpan ne bank se 2000 top-up kiya, PSP (Razorpay / bank) dheema</text>
<rect x="30" y="185" width="200" height="110" rx="12" fill="#10243f" stroke="#4aa8ff" stroke-width="2.5"/>
<text x="130.0" y="219" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle">Arpan</text>
<text x="130.0" y="245" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">bank se 2000</text>
<text x="130.0" y="267" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">top-up</text>
<rect x="300" y="175" width="270" height="140" rx="12" fill="#0f2a22" stroke="#3ddc97" stroke-width="2.5"/>
<text x="435.0" y="209" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle">Payment Svc</text>
<text x="435.0" y="235" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">2-3 sec me jawab nahi</text>
<text x="435.0" y="257" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">to PENDING (fail nahi)</text>
<rect x="660" y="160" width="280" height="170" rx="12" fill="#152033" stroke="#4aa8ff" stroke-width="2.5"/>
<text x="800.0" y="194" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle">Circuit breaker</text>
<text x="800.0" y="220" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">5 fail = khula (OPEN)</text>
<text x="800.0" y="242" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">call jaati hi nahi</text>
<text x="800.0" y="264" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">30 sec baad ek test call</text>
<rect x="1030" y="185" width="440" height="120" rx="12" fill="#152033" stroke="#9fb0c8" stroke-width="2.5"/>
<text x="1250.0" y="219" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle">PSP</text>
<text x="1250.0" y="245" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">Razorpay / bank</text>
<text x="1250.0" y="267" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">aaj dheema (30 sec)</text>
<path d="M232 245 L296 245" fill="none" stroke="#4aa8ff" stroke-width="3" marker-end="url(#ablue)"/>
<path d="M572 245 L656 245" fill="none" stroke="#ffa94d" stroke-width="3" marker-end="url(#aorange)"/>

<text x="1400" y="190" font-size="14" font-weight="700" fill="#ff5a6a" text-anchor="middle">1</text>
<circle cx="975" cy="245" r="14" fill="#1a0f14" stroke="#ff5a6a" stroke-width="2.5"/>
<text x="975" y="250" font-size="14" font-weight="700" fill="#ff5a6a" text-anchor="middle">2</text>
<rect x="30" y="390" width="1440" height="64" rx="9" fill="#0f2a22" stroke="#3ddc97" stroke-width="2"/>
<text x="48" y="416" font-size="14" font-weight="700" fill="#3ddc97">Kyun chalta:</text>
<text x="160" y="416" font-size="13.5" fill="#cfeee0">Call gayi aur 2-3 sec me jawab nahi = PENDING, &quot;fail&quot; kabhi nahi (paisa shayad kat gaya ho). Baar-baar fail to breaker khula: call jaati hi nahi, saaf &quot;abhi</text>
<text x="160" y="436" font-size="13.5" fill="#cfeee0">nahi&quot;</text>
<rect x="30" y="484" width="345" height="120" rx="9" fill="#1a0f14" stroke="#ff5a6a" stroke-width="2"/>
<circle cx="52" cy="509" r="12" fill="#ff5a6a"/>
<text x="52" y="514" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">1</text>
<text x="74" y="514" font-size="15" font-weight="700" fill="#ff5a6a">PSP hi poora band</text>
<text x="52" y="541" font-size="13.5" fill="#7fe0b0">Naye payment doosre PSP se. Par ek payment</text>
<text x="52" y="561" font-size="13.5" fill="#7fe0b0">hamesha ek hi PSP pe</text>
<rect x="392" y="484" width="345" height="120" rx="9" fill="#1a0f14" stroke="#ff5a6a" stroke-width="2"/>
<circle cx="414" cy="509" r="12" fill="#ff5a6a"/>
<text x="414" y="514" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">2</text>
<text x="436" y="514" font-size="15" font-weight="700" fill="#ff5a6a">Call gayi, jawab nahi aaya</text>
<text x="414" y="541" font-size="13.5" fill="#7fe0b0">PENDING likho, &quot;fail&quot; kabhi nahi. Baad me</text>
<text x="414" y="561" font-size="13.5" fill="#7fe0b0">pata karo (card 5)</text>
<rect x="30" y="639" width="1440" height="66" rx="9" fill="#221c08" stroke="#ffcc4d" stroke-width="2"/>
<text x="48" y="665" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>
<text x="48" y="689" font-size="13.5" fill="#e6dcb8">Timeout lagao hi mat, jawab ka intezaar karo: Har thread PSP pe 30 sec ruka, sab atke, system band</text>
<rect x="30" y="727" width="1440" height="72" rx="9" fill="#141c2b" stroke="#3a4a63" stroke-width="2"/>
<text x="48" y="757" font-size="13.5" fill="#c9d6e8">Call gayi hi nahi (breaker khula) = saaf &quot;abhi nahi&quot;, paisa hila hi nahi. 30 sec baad ek test call: chali to breaker band.</text>
<text x="48" y="779" font-size="13.5" fill="#c9d6e8">PSP kya hai? Bahar ka paisa le jaane wala: bank se wallet (top-up), wallet se bank (payout), doosre bank ka merchant</text>
<rect x="30" y="821" width="1440" height="44" rx="9" fill="#221c08" stroke="#ffcc4d" stroke-width="2"/>
<text x="48" y="849" font-size="15" font-weight="700" fill="#ffcc4d">AGLA &gt;</text>
<text x="118" y="849" font-size="14.5" fill="#e6dcb8">ab call gayi, aur jawab se pehle hum hi gir gaye to? (card 5)</text>
