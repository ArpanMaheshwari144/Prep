<text x="30" y="68" font-size="15" fill="#9fb0c8">Laal number = yahan toot sakta hai, neeche usi number pe: laal = kya hua, hara = kaise bacha</text>

<text x="48" y="356" font-size="14" font-weight="700" fill="#3ddc97">Kyun chalta:</text>
<text x="160" y="356" font-size="13.5" fill="#cfeee0">Call gayi aur jawab nahi aaya = PENDING, &quot;fail&quot; kabhi nahi. Call gayi hi nahi (circuit OPEN) = saaf &quot;abhi nahi&quot;</text>

<text x="414" y="481" font-size="13.5" fill="#7fe0b0">pata karo (card 5)</text>

<text x="48" y="585" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>
<text x="48" y="609" font-size="13.5" fill="#e6dcb8">Timeout lagao hi mat, wait karo: Har thread PSP ke 30 sec tak ruka, sab atke, system band</text>
<rect x="30" y="647" width="1440" height="72" rx="9" fill="#141c2b" stroke="#3a4a63" stroke-width="2"/>
<text x="48" y="677" font-size="13.5" fill="#c9d6e8">Call gayi hi nahi (circuit OPEN) = saaf &#x27;abhi nahi&#x27;, paisa hila nahi. 30 sec baad test call: chali to band, nahi to phir OPEN.</text>
<text x="48" y="699" font-size="13.5" fill="#c9d6e8">PSP kya? Bahar ka paisa: bank se wallet (top-up), wallet se bank (payout), doosre bank ka merchant</text>
