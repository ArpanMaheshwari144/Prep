<text x="160" y="446" font-size="13.5" fill="#cfeee0">SMS ki khabar outbox table me, transfer ke saath usi transaction me. Relay COMMIT ke baad Kafka ko bhejta. Paisa pakka hua tabhi khabar. SMS band ho to khabar</text>
<text x="160" y="466" font-size="13.5" fill="#cfeee0">Kafka me padi rehti</text>

<text x="52" y="592" font-size="13.5" fill="#7fe0b0">Khabar dobara jaati: SMS service eventId</text>

<rect x="30" y="677" width="1440" height="66" rx="9" fill="#221c08" stroke="#ffcc4d" stroke-width="2"/>
<text x="48" y="703" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>
<text x="48" y="727" font-size="13.5" fill="#e6dcb8">Transfer ke beech seedha SMS service bulao: Service band thi: khabar gayi   ·   Pehle Kafka me khabar, DB baad me: &quot;Ravi ko 20,000 aaye&quot; SMS gaya, DB fail: paisa gaya hi nahi</text>
<rect x="30" y="765" width="1440" height="72" rx="9" fill="#141c2b" stroke="#3a4a63" stroke-width="2"/>
<text x="48" y="795" font-size="13.5" fill="#c9d6e8">Outbox bharti jaaye? Bheji hui (sent=true) roz saaf. Relay likhna hi na pade? DB ke badlaav se padho (CDC, Debezium).</text>
<text x="48" y="817" font-size="13.5" fill="#c9d6e8">Arpan ke SMS ulte kram me? Kafka key = account_id: ek account ek line</text>

<text x="48" y="887" font-size="15" font-weight="700" fill="#ffcc4d">AGLA &gt;</text>
<text x="118" y="887" font-size="14.5" fill="#e6dcb8">ab khaata bhi hai, balance column bhi. Dono me farak aaya to? (card 6)</text>
