<text x="48" y="534" font-size="14" font-weight="700" fill="#3ddc97">Kyun chalta:</text>
<text x="160" y="534" font-size="13.5" fill="#cfeee0">Redis ki copy pehle se taiyaar rehti. Dono gire to kya karna hai, ye pehle se likha hai: login jaisi cheez band (fail-closed), feed jaisi khuli (fail-open)</text>
<rect x="30" y="582" width="345" height="128" rx="9" fill="#1a0f14" stroke="#ff5a6a" stroke-width="2"/>
<circle cx="52" cy="607" r="12" fill="#ff5a6a"/>
<text x="52" y="612" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">1</text>
<text x="74" y="612" font-size="15" font-weight="700" fill="#ff5a6a">Redis ne jawab hi nahi diya. Gira hai,</text>
<text x="74" y="633" font-size="15" font-weight="700" fill="#ff5a6a">pata kaise chale?</text>
<text x="52" y="660" font-size="13.5" fill="#7fe0b0">Chhota timeout (~5 ms). Itne me jawab nahi</text>
<text x="52" y="680" font-size="13.5" fill="#7fe0b0">aaya to gira maano, ruko mat</text>
<rect x="392" y="582" width="345" height="128" rx="9" fill="#1a0f14" stroke="#ff5a6a" stroke-width="2"/>
<circle cx="414" cy="607" r="12" fill="#ff5a6a"/>
<text x="414" y="612" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">2</text>
<text x="436" y="612" font-size="15" font-weight="700" fill="#ff5a6a">Redis primary gira</text>
<text x="414" y="639" font-size="13.5" fill="#7fe0b0">Copy primary ban jaati (Redis Cluster).</text>
<text x="414" y="659" font-size="13.5" fill="#7fe0b0">Beech ke kuch second ki ginti gayi, chalta</text>
<text x="414" y="679" font-size="13.5" fill="#7fe0b0">hai</text>
<rect x="754" y="582" width="345" height="128" rx="9" fill="#1a0f14" stroke="#ff5a6a" stroke-width="2"/>
<circle cx="776" cy="607" r="12" fill="#ff5a6a"/>
<text x="776" y="612" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">3</text>
<text x="798" y="612" font-size="15" font-weight="700" fill="#ff5a6a">Copy bhi gayi, dono Redis band</text>
<text x="776" y="639" font-size="13.5" fill="#7fe0b0">Pehle se tay hai (upar wala dabba): login</text>
<text x="776" y="659" font-size="13.5" fill="#7fe0b0">band, user ko 503. Feed khula, tab tak</text>
<text x="776" y="679" font-size="13.5" fill="#7fe0b0">gateway apni ginti</text>
<rect x="30" y="745" width="1440" height="66" rx="9" fill="#221c08" stroke="#ffcc4d" stroke-width="2"/>
<text x="48" y="771" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>
<text x="48" y="795" font-size="13.5" fill="#e6dcb8">Sab kuch khula chhod dete (fail-open): Login bhi khul jaata: koi bhi bina had Arpan ka password try karta</text>
<rect x="30" y="833" width="1440" height="72" rx="9" fill="#141c2b" stroke="#3a4a63" stroke-width="2"/>
<text x="48" y="863" font-size="13.5" fill="#c9d6e8">Redis gira nahi, bas CPU full tha. Copy laga doon? Nahi: ginti badhana = likhna, aur likhna sirf primary pe hota.</text>
<text x="48" y="885" font-size="13.5" fill="#c9d6e8">Isliye tukde (shard): har user ki ginti alag Redis machine pe</text>
<rect x="30" y="927" width="1440" height="44" rx="9" fill="#221c08" stroke="#ffcc4d" stroke-width="2"/>
<text x="48" y="955" font-size="15" font-weight="700" fill="#ffcc4d">AGLA &gt;</text>
<text x="118" y="955" font-size="14.5" fill="#e6dcb8">ab ek region me sab theek. Par Arpan kai region se aaye to? (card 5)</text>
