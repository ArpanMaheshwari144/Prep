<text x="30" y="40" font-size="26" font-weight="700" fill="#e6edf3">Card 4: Redis ki copy taiyaar. Copy bhi gayi to pehle se tay: login band, feed khula</text>

<text x="48" y="474" font-size="14" font-weight="700" fill="#3ddc97">Kyun chalta:</text>
<text x="160" y="474" font-size="13.5" fill="#cfeee0">Redis gire to kya karna hai, ye pehle se tay hai, endpoint ke hisaab se</text>

<text x="52" y="552" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">1</text>
<text x="74" y="552" font-size="15" font-weight="700" fill="#ff5a6a">Redis ne jawab nahi diya. Gira hai,</text>
<text x="74" y="573" font-size="15" font-weight="700" fill="#ff5a6a">pata kaise chale?</text>
<text x="52" y="600" font-size="13.5" fill="#7fe0b0">Chhota timeout (~5 ms). Jawab nahi aaya to</text>
<text x="52" y="620" font-size="13.5" fill="#7fe0b0">gira maano, ruko mat</text>
<rect x="392" y="522" width="345" height="128" rx="9" fill="#1a0f14" stroke="#ff5a6a" stroke-width="2"/>

<text x="414" y="552" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">2</text>
<text x="436" y="552" font-size="15" font-weight="700" fill="#ff5a6a">Redis primary gira</text>
<text x="414" y="579" font-size="13.5" fill="#7fe0b0">Copy primary ban jaati (Redis Cluster).</text>
<text x="414" y="599" font-size="13.5" fill="#7fe0b0">Beech ki kuch sec ki ginti gayi, chalta hai</text>
<rect x="754" y="522" width="345" height="128" rx="9" fill="#1a0f14" stroke="#ff5a6a" stroke-width="2"/>

<text x="776" y="552" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">3</text>
<text x="798" y="552" font-size="15" font-weight="700" fill="#ff5a6a">Copy bhi gayi, dono Redis band</text>
<text x="776" y="579" font-size="13.5" fill="#7fe0b0">Pehle se tay hai, endpoint ke hisaab se</text>
<text x="776" y="599" font-size="13.5" fill="#7fe0b0">(upar dabba)</text>

<text x="48" y="711" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>
<text x="48" y="735" font-size="13.5" fill="#e6dcb8">Sab fail-open kar dete: Login khula: koi bhi bina had password try karta</text>

<text x="48" y="803" font-size="13.5" fill="#c9d6e8">CPU full tha, Redis gira nahi. Copy laga doon? Nahi: INCR likhna hai, aur likhna sirf primary pe hota.</text>
<text x="48" y="825" font-size="13.5" fill="#c9d6e8">Isliye SHARD: har user ki key alag Redis pe</text>
