<text x="30" y="40" font-size="26" font-weight="700" fill="#e6edf3">Card 4: Redis ki copy taiyaar. Copy bhi gayi to pehle se tay: login band, feed khula</text>
<text x="30" y="68" font-size="16" fill="#9fb0c8">Laal X = yahan gira / toota · Peela dabba = pehle aisa tha (X nahi) · har dabbe me hara = kaise bacha</text>

<text x="160.0" y="260" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">har request pe Redis</text>
<text x="160.0" y="282" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">se poochta, ~5 ms tak</text>
<rect x="420" y="160" width="260" height="90" rx="12" fill="#2a1a10" stroke="#ffa94d" stroke-width="2.5"/>
<text x="550.0" y="194" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle">Redis main</text>
<text x="550.0" y="220" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">ginti yahin likhi jaati</text>
<rect x="420" y="330" width="260" height="90" rx="12" fill="#2a1a10" stroke="#ffa94d" stroke-width="2.5"/>
<text x="550.0" y="364" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle">Redis copy</text>
<text x="550.0" y="390" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">main gira to yahi main</text>

<text x="1030.0" y="224" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle">Endpoint ke hisaab se</text>
<text x="1030.0" y="250" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">login: band, user ko 503</text>
<text x="1030.0" y="272" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">feed: khula, Redis aate hi band</text>
<text x="1030.0" y="294" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">tab tak gateway apni ginti</text>

<text x="722" y="388" font-size="13" fill="#6b7a90" class="m">copy bhi gayi</text>

<text x="52" y="111" font-size="14" font-weight="700" fill="#0b1220" text-anchor="middle">1</text>
<text x="74" y="111" font-size="15" font-weight="700" fill="#ff5a6a">Redis ne jawab nahi diya. Gira hai, pata kaise chale?</text>
<text x="52" y="135" font-size="15" font-weight="700" fill="#3ddc97">Chhota timeout (~5 ms). Jawab nahi aaya to gira maano, ruko mat</text>

<g stroke="#ff5a6a" stroke-width="5" stroke-linecap="round"><line x1="660" y1="148" x2="684" y2="172"/><line x1="684" y1="148" x2="660" y2="172"/></g>

<text x="742" y="111" font-size="14" font-weight="700" fill="#0b1220" text-anchor="middle">2</text>
<text x="764" y="111" font-size="15" font-weight="700" fill="#ff5a6a">Redis main gira</text>
<text x="742" y="135" font-size="15" font-weight="700" fill="#3ddc97">Copy main ban jaati (Redis Cluster). Beech ki kuch sec ki ginti gayi, chalta hai</text>

<g stroke="#ff5a6a" stroke-width="5" stroke-linecap="round"><line x1="660" y1="408" x2="684" y2="432"/><line x1="684" y1="408" x2="660" y2="432"/></g>

<text x="402" y="497" font-size="14" font-weight="700" fill="#0b1220" text-anchor="middle">3</text>
<text x="424" y="497" font-size="15" font-weight="700" fill="#ff5a6a">Copy bhi gayi, dono Redis band</text>
<text x="402" y="521" font-size="15" font-weight="700" fill="#3ddc97">Pehle se tay hai, endpoint ke hisaab se (upar dabba)</text>

<text x="1024" y="497" font-size="15" font-weight="700" fill="#ffcc4d">Sab fail-open kar dete?</text>
<text x="1002" y="521" font-size="15" font-weight="700" fill="#3ddc97">Login khula: koi bhi bina had password try karta</text>
<rect x="30" y="560" width="1440" height="62" rx="9" fill="#141c2b" stroke="#6b7a90" stroke-width="2"/>
<text x="52" y="587" font-size="15" font-weight="700" fill="#c9d6e8">CPU full tha, Redis gira nahi. Copy laga doon? Nahi: INCR likhna hai, aur likhna sirf main pe hota.</text>
<text x="52" y="611" font-size="15" font-weight="700" fill="#9fb0c8">Isliye SHARD: har user ki key alag Redis pe</text>
