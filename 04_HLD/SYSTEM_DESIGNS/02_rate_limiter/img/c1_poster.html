<text x="30" y="40" font-size="26" font-weight="700" fill="#e6edf3">Card 1: sab App ek hi Redis ginti dekhte hain. Chhathi request pe 429</text>
<text x="30" y="68" font-size="15" fill="#9fb0c8">Laal number = yahan toot sakta hai, neeche usi number pe: laal = kya hua, hara = kaise bacha</text>

<text x="48" y="110" font-size="14" font-weight="700" fill="#ff8a95">Pehle aisa tha:</text>
<text x="170" y="110" font-size="13.5" fill="#d9b8bd">Har App apni ginti rakhta tha: 5 + 4 = 9 andar</text>
<rect x="30" y="212" width="220" height="100" rx="12" fill="#10243f" stroke="#4aa8ff" stroke-width="2.5"/>

<rect x="340" y="162" width="220" height="90" rx="12" fill="#0f2a22" stroke="#3ddc97" stroke-width="2.5"/>

<text x="450.0" y="222" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">har baar Redis se poochta</text>
<rect x="340" y="312" width="220" height="90" rx="12" fill="#0f2a22" stroke="#3ddc97" stroke-width="2.5"/>
<text x="450.0" y="346" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle">App 2</text>
<text x="450.0" y="372" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">wahi Redis, wahi ginti</text>
<rect x="700" y="212" width="330" height="120" rx="12" fill="#2a1a10" stroke="#ffa94d" stroke-width="2.5"/>
<text x="865.0" y="246" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle">Redis (ginti yahin)</text>
<text x="865.0" y="272" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">rate:Arpan:login = 6</text>
<text x="865.0" y="294" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">60 sec baad key khud mit jaati</text>
<text x="865.0" y="316" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">had 5, chhathi pe mana</text>

<text x="48" y="488" font-size="14" font-weight="700" fill="#3ddc97">Kyun chalta:</text>
<text x="160" y="488" font-size="13.5" fill="#cfeee0">Ginti ek hi jagah hai aur RAM jitni tez hai. Key ki umar hi window hai, minute khatam to key mit jaati</text>
<rect x="30" y="536" width="345" height="128" rx="9" fill="#1a0f14" stroke="#ff5a6a" stroke-width="2"/>
<circle cx="52" cy="561" r="12" fill="#ff5a6a"/>
<text x="52" y="566" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">1</text>
<text x="74" y="566" font-size="15" font-weight="700" fill="#ff5a6a">Minute ke kinare pe 5 aur agle minute</text>
<text x="74" y="587" font-size="15" font-weight="700" fill="#ff5a6a">ke shuru me 5: 2 sec me 10 andar</text>
<text x="52" y="614" font-size="13.5" fill="#7fe0b0">Ye fixed window ki kamzori hai. Isliye asli</text>
<text x="52" y="634" font-size="13.5" fill="#7fe0b0">me token bucket lagate</text>
<rect x="30" y="699" width="1440" height="66" rx="9" fill="#221c08" stroke="#ffcc4d" stroke-width="2"/>
<text x="48" y="725" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>
<text x="48" y="749" font-size="13.5" fill="#e6dcb8">Ginti DB me rakhte: Har request pe disk aur lock, bahut dheema. Redis RAM me hai, ~1 ms   ·   Sticky LB se Arpan ko hamesha ek hi App pe bhejte: Wo App gira to Arpan ki ginti bhi saath gayi</text>
