<text x="48" y="548" font-size="14" font-weight="700" fill="#3ddc97">Kyun chalta:</text>
<text x="160" y="548" font-size="13.5" fill="#cfeee0">Saari App ek hi jagah (Redis) ginti dekhti hain, aur Redis RAM me hai to tez. Ginti ki umar 60 sec hai: minute khatam to ginti khud mit jaati, naya minute 0 se</text>
<rect x="30" y="596" width="345" height="169" rx="9" fill="#1a0f14" stroke="#ff5a6a" stroke-width="2"/>

<text x="74" y="626" font-size="15" font-weight="700" fill="#ff5a6a">Minute ke aakhri second me 5 aur agle</text>
<text x="74" y="647" font-size="15" font-weight="700" fill="#ff5a6a">minute ke pehle second me 5: 2 sec me</text>
<text x="74" y="668" font-size="15" font-weight="700" fill="#ff5a6a">10 andar</text>
<text x="52" y="695" font-size="13.5" fill="#7fe0b0">Ye &quot;minute wali&quot; ginti (fixed window) ki</text>
<text x="52" y="715" font-size="13.5" fill="#7fe0b0">kamzori hai. Isliye asli me token bucket</text>
<text x="52" y="735" font-size="13.5" fill="#7fe0b0">lagate</text>
<rect x="30" y="800" width="1440" height="86" rx="9" fill="#221c08" stroke="#ffcc4d" stroke-width="2"/>
<text x="48" y="826" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>
<text x="48" y="850" font-size="13.5" fill="#e6dcb8">Ginti DB me rakhte: Har request pe disk aur lock, bahut dheema. Redis RAM me hai, ~1 ms   ·   LB se Arpan ko hamesha ek hi App pe bhejte (sticky): Wo App giri to Arpan ki ginti bhi saath</text>
<text x="48" y="870" font-size="13.5" fill="#e6dcb8">gayi</text>

<text x="48" y="958" font-size="15" font-weight="700" fill="#ffcc4d">AGLA &gt;</text>
