<text x="160" y="496" font-size="13.5" fill="#cfeee0">Garam key ko faila do. Ek key = ek machine, crore read / sec pe A ka CPU full, B aur C khaali. Isliye bheed baantni padti hai</text>

<text x="74" y="595" font-size="15" font-weight="700" fill="#ff5a6a">sec)</text>
<text x="52" y="622" font-size="13.5" fill="#7fe0b0">L1: har App 1-2 sec me ek baar A se. Ya key</text>
<text x="52" y="642" font-size="13.5" fill="#7fe0b0">ki copy score#1..#10</text>
<rect x="30" y="707" width="1440" height="66" rx="9" fill="#221c08" stroke="#ffcc4d" stroke-width="2"/>
<text x="48" y="733" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>
<text x="48" y="757" font-size="13.5" fill="#e6dcb8">Consistent hashing se bheed bat jaayegi: Ring key baant-ta, ek key ki bheed nahi: ek key = ek machine</text>
<rect x="30" y="795" width="1440" height="116" rx="9" fill="#141c2b" stroke="#3a4a63" stroke-width="2"/>
<text x="48" y="825" font-size="13.5" fill="#c9d6e8">Garam key pakdoge kaise? App me ginti + machine metric achanak upar. Likhna bhi (like)? Tukde like#0..#9, padhte waqt jodo.</text>
<text x="48" y="847" font-size="13.5" fill="#c9d6e8">L1 kitna purana? 1-2 sec: score me chalta, paisa / stock me nahi</text>
<text x="48" y="869" font-size="13.5" fill="#c9d6e8">Parat: L1 (App RAM) -&gt; L2 Redis -&gt; DB, neeche wali dheemi.</text>
<text x="48" y="891" font-size="13.5" fill="#c9d6e8">Stampede = key khaali (lock). Hot key = key bhari, ek machine pe bheed (L1)</text>
