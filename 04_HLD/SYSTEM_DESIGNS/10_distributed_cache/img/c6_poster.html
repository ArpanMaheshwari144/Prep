<text x="48" y="556" font-size="14" font-weight="700" fill="#3ddc97">Kyun chalta:</text>
<text x="160" y="556" font-size="13.5" fill="#cfeee0">Ek key = ek machine, to crore read ek hi machine pe. Isliye garam key ki 1-2 sec ki copy har App apni RAM me rakhe (L1). Machine A pe har App ka 1-2 sec me ek</text>
<text x="160" y="576" font-size="13.5" fill="#cfeee0">hi chakkar</text>

<text x="74" y="675" font-size="15" font-weight="700" fill="#ff5a6a">sec)</text>
<text x="52" y="702" font-size="13.5" fill="#7fe0b0">Har App 1-2 sec me ek hi baar A se padhe</text>
<text x="52" y="722" font-size="13.5" fill="#7fe0b0">(L1). Ya key ki 10 copy (score#1 .. #10),</text>
<text x="52" y="742" font-size="13.5" fill="#7fe0b0">kisi se bhi padho</text>
<rect x="30" y="807" width="1440" height="66" rx="9" fill="#221c08" stroke="#ffcc4d" stroke-width="2"/>
<text x="48" y="833" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>
<text x="48" y="857" font-size="13.5" fill="#e6dcb8">Ring se bheed bat jaayegi: Ring key baant-ta, ek key ki bheed nahi: ek key = ek hi machine</text>
<rect x="30" y="895" width="1440" height="116" rx="9" fill="#141c2b" stroke="#3a4a63" stroke-width="2"/>
<text x="48" y="925" font-size="13.5" fill="#c9d6e8">Garam key kaise pakdein? App me ginti, ya machine ka CPU achanak upar. Likhna bhi garam (like)? Ginti 10 tukdon me, padhte waqt jodo.</text>
<text x="48" y="947" font-size="13.5" fill="#c9d6e8">App ki copy kitni purani? 1-2 sec: score me chalta, paisa / stock me nahi</text>
<text x="48" y="969" font-size="13.5" fill="#c9d6e8">Parat: App ki RAM (L1) -&gt; Redis (L2) -&gt; DB. Neeche wali dheemi.</text>
<text x="48" y="991" font-size="13.5" fill="#c9d6e8">Fark: key khaali = sab DB pe (card 5, taala). Key bhari = sab ek machine pe (yahan, L1)</text>
