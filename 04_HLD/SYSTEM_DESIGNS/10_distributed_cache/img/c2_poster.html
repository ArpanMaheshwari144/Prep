<text x="160" y="515" font-size="13.5" fill="#cfeee0">Machine jude ya jaaye to sirf pados ki ~K/N key hilti hain (K = saari key, N = machine). Sirf us hisse ki ek baar miss, baaki hit</text>

<text x="48" y="744" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>
<text x="48" y="768" font-size="13.5" fill="#e6dcb8">Seedha hash % N: 4 se 5 machine = ~80% key hili. Ring me N hai hi nahi   ·   A-M ek pe, N-Z doosre pe: Ek range garam (sab &#x27;S&#x27; naam). Hash se key bikhar jaati</text>
