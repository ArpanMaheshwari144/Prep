<text x="48" y="811" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>
<text x="48" y="835" font-size="13.5" fill="#e6dcb8">Seedha hash % machine ginti se baanto: 4 se 5 machine ki to ~80% key ki jagah badal gayi. Ring me machine ginti hai hi nahi   ·   Naam se baanto: A-M ek pe, N-Z doosre pe: Ek range garam ho</text>

<text x="48" y="923" font-size="13.5" fill="#c9d6e8">Nayi machine D judi? Sirf pados ki key khiski (C se D), baaki sab wahin.</text>
