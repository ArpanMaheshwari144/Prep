<text x="48" y="776" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>
<text x="48" y="800" font-size="13.5" fill="#e6dcb8">Sirf DB me badlo: DB me &quot;Arpan K&quot;, cache me purana: sab &quot;Arpan&quot; dekhte   ·   Har likhai cache me bhi (write-through)? Ya pehle cache, DB baad me (write-back): Through: likhna dheema. Back:</text>

<text x="48" y="888" font-size="13.5" fill="#c9d6e8">Arpan ko apna hi purana naam dikha? DB ki copy peeche hai.</text>
<text x="48" y="910" font-size="13.5" fill="#c9d6e8">Jisne abhi likha, use kuch der primary se padhao</text>
