<text x="30" y="40" font-size="26" font-weight="700" fill="#e6edf3">Card 1: RAM bhari to sabse der se chhua bahar (LRU), har key ki umar (TTL). HashMap + list = O(1). Sach DB me</text>
<text x="30" y="68" font-size="16" fill="#9fb0c8">Laal X = yahan gira / toota · Peela dabba = pehle aisa tha (X nahi) · har dabbe me hara = kaise bacha</text>

<text x="570.0" y="250" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">HashMap + doubly linked list</text>
<text x="570.0" y="272" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">chhua = aage</text>
<text x="570.0" y="294" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">RAM bhari: peeche wala bahar</text>

<text x="672" y="135" font-size="15" font-weight="700" fill="#3ddc97">Sabse der se chhua (user:7) bahar. Hati key = ek miss, DB se wapas</text>
<rect x="30" y="480" width="1440" height="62" rx="9" fill="#141c2b" stroke="#6b7a90" stroke-width="2"/>
<text x="52" y="507" font-size="15" font-weight="700" fill="#c9d6e8">Hatana hi band (noeviction)? Naya likhna error. Cache me allkeys-lru. Redis poori LRU list? Nahi: kuch random key me sabse purani.</text>
<text x="52" y="531" font-size="15" font-weight="700" fill="#9fb0c8">user:9 phir padha? Utha ke aage, ab sabse baad me nikalega</text>
<rect x="30" y="570" width="1440" height="62" rx="9" fill="#141c2b" stroke="#6b7a90" stroke-width="2"/>
<text x="52" y="597" font-size="15" font-weight="700" fill="#c9d6e8">Umar kitni? Jitna purana jhel sako: profile = minute, price / stock = second.</text>
<text x="52" y="621" font-size="15" font-weight="700" fill="#9fb0c8">Umar khatam to agla MISS, DB se taaza laata. Cache khaali ho tab bhi sahi data DB se</text>
