<text x="30" y="40" font-size="26" font-weight="700" fill="#e6edf3">Card 1: RAM bhari to sabse der se chhua bahar (LRU), har key ki umar (TTL). HashMap + list = O(1). Sach DB me</text>
<text x="30" y="68" font-size="15" fill="#9fb0c8">Laal number = yahan toot sakta hai, neeche usi number pe: laal = kya hua, hara = kaise bacha</text>

<text x="145.0" y="246" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">HIT: &lt;1 ms</text>

<text x="570.0" y="148" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle">Cache</text>
<text x="570.0" y="174" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">HashMap + doubly linked list</text>
<text x="570.0" y="196" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">chhua = aage</text>
<text x="570.0" y="218" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">RAM bhari: peeche wala bahar</text>
<text x="570.0" y="240" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">har key ki umar (TTL)</text>

<text x="740" y="119" font-size="14" font-weight="700" fill="#ff5a6a" text-anchor="middle">1</text>
<rect x="30" y="419" width="1440" height="44" rx="9" fill="#0f2a22" stroke="#3ddc97" stroke-width="2"/>
<text x="48" y="445" font-size="14" font-weight="700" fill="#3ddc97">Kyun chalta:</text>
<text x="160" y="445" font-size="13.5" fill="#cfeee0">RAM bhari to sabse purana chhua pehle jaata hai, umar khatam to key bekaar. Hati key sirf ek miss hai, App DB se laake wapas rakh deta hai</text>
<rect x="30" y="493" width="345" height="120" rx="9" fill="#1a0f14" stroke="#ff5a6a" stroke-width="2"/>
<circle cx="52" cy="518" r="12" fill="#ff5a6a"/>
<text x="52" y="523" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">1</text>
<text x="74" y="523" font-size="15" font-weight="700" fill="#ff5a6a">Subah RAM bhar gayi</text>
<text x="52" y="550" font-size="13.5" fill="#7fe0b0">Sabse der se chhua (user:7) bahar. Hati key</text>
<text x="52" y="570" font-size="13.5" fill="#7fe0b0">= ek miss, DB se wapas</text>
<rect x="30" y="648" width="1440" height="66" rx="9" fill="#221c08" stroke="#ffcc4d" stroke-width="2"/>
<text x="48" y="674" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>
<text x="48" y="698" font-size="13.5" fill="#e6dcb8">LFU (kitni baar chhua): Kal ki famous key aaj bhi baithi. Default LRU</text>
<rect x="30" y="736" width="1440" height="116" rx="9" fill="#141c2b" stroke="#3a4a63" stroke-width="2"/>
<text x="48" y="766" font-size="13.5" fill="#c9d6e8">Hatana hi band (noeviction)? Naya likhna error. Cache me allkeys-lru. Redis poori LRU list? Nahi: kuch random key me sabse purani.</text>
<text x="48" y="788" font-size="13.5" fill="#c9d6e8">user:9 phir padha? Utha ke aage, ab sabse baad me nikalega</text>
<text x="48" y="810" font-size="13.5" fill="#c9d6e8">Umar kitni? Jitna purana jhel sako: profile = minute, price / stock = second.</text>
<text x="48" y="832" font-size="13.5" fill="#c9d6e8">Umar khatam to agla MISS, DB se taaza laata. Cache khaali ho tab bhi sahi data DB se</text>
