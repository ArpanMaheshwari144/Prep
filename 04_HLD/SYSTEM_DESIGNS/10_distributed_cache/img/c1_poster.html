<text x="30" y="40" font-size="26" font-weight="700" fill="#e6edf3">Card 1: RAM bhari to sabse der se chhua bahar (LRU), har key ki umar (TTL). HashMap + list = O(1). Sach DB me</text>
<text x="30" y="68" font-size="15" fill="#9fb0c8">Laal number = yahan toot sakta hai, neeche usi number pe: laal = kya hua, hara = kaise bacha</text>
<rect x="1330" y="50" width="140" height="28" rx="14" fill="#2a1a10" stroke="#ffa94d" stroke-width="2"/>
<text x="1400" y="69" font-size="14" font-weight="700" fill="#ffa94d" text-anchor="middle">card 1 / 6</text>
<rect x="30" y="84" width="1440" height="46" rx="9" fill="#111a2a" stroke="#33425a" stroke-width="2"/>
<text x="48" y="113" font-size="15" font-weight="700" fill="#9fb0c8">Peeche:</text>
<text x="118" y="113" font-size="14.5" fill="#c9d6e8">shuru: ek cache machine, har cheez RAM me</text>
<text x="760" y="113" font-size="15" font-weight="700" fill="#ff8a95">Ab:</text>
<text x="796" y="113" font-size="14.5" fill="#f0d4d8">Subah cache machine ki RAM bhar gayi, Arpan ki profile kahan rakhein?</text>
<rect x="30" y="224" width="230" height="130" rx="12" fill="#0f2a22" stroke="#3ddc97" stroke-width="2.5"/>
<text x="145.0" y="258" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle">App</text>
<text x="145.0" y="284" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">GET profile:42</text>
<text x="145.0" y="306" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">HIT: &lt;1 ms</text>
<rect x="360" y="174" width="420" height="190" rx="12" fill="#2a1a10" stroke="#ffa94d" stroke-width="2.5"/>
<text x="570.0" y="208" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle">Cache</text>
<text x="570.0" y="234" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">HashMap + doubly linked list</text>
<text x="570.0" y="256" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">chhua = aage</text>
<text x="570.0" y="278" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">RAM bhari: peeche wala bahar</text>
<text x="570.0" y="300" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">har key ki umar (TTL)</text>
<rect x="880" y="224" width="280" height="120" rx="12" fill="#1d1838" stroke="#a98bff" stroke-width="2.5"/>
<text x="1020.0" y="258" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle">DB</text>
<text x="1020.0" y="284" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">sach yahan</text>
<text x="1020.0" y="306" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">MISS: ~10 ms</text>
<rect x="1250" y="224" width="220" height="120" rx="12" fill="#152033" stroke="#4aa8ff" stroke-width="2.5"/>
<text x="1360.0" y="258" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle">user:7 bahar</text>
<text x="1360.0" y="284" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">sabse der se</text>
<text x="1360.0" y="306" font-size="13" fill="#c9d6e8" class="m" text-anchor="middle">chhua tha</text>
<path d="M262 284 L356 284" fill="none" stroke="#a98bff" stroke-width="3" marker-end="url(#apurple)"/>
<text x="305" y="264" font-size="13" fill="#a98bff" class="m" text-anchor="middle">pehle cache</text>
<path d="M782 284 L876 284" fill="none" stroke="#6b7a90" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#agrey)"/>
<text x="830" y="274" font-size="13" fill="#6b7a90" class="m" text-anchor="middle">MISS</text>
<path d="M570 366 L570 419 L1360 419 L1360 348" fill="none" stroke="#6b7a90" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#agrey)"/>
<text x="960" y="409" font-size="13" fill="#6b7a90" class="m" text-anchor="middle">RAM bhari: bahar</text>
<circle cx="740" cy="174" r="14" fill="#1a0f14" stroke="#ff5a6a" stroke-width="2.5"/>
<text x="740" y="179" font-size="14" font-weight="700" fill="#ff5a6a" text-anchor="middle">1</text>
<rect x="30" y="479" width="1440" height="44" rx="9" fill="#0f2a22" stroke="#3ddc97" stroke-width="2"/>
<text x="48" y="505" font-size="14" font-weight="700" fill="#3ddc97">Kyun chalta:</text>
<text x="160" y="505" font-size="13.5" fill="#cfeee0">RAM bhari to jo sabse der se chhua gaya wo bahar (LRU). Har key ki umar bhi (TTL). Hati key sirf ek miss: App DB se laake wapas rakh deta. Asli data DB me</text>
<rect x="30" y="553" width="345" height="120" rx="9" fill="#1a0f14" stroke="#ff5a6a" stroke-width="2"/>
<circle cx="52" cy="578" r="12" fill="#ff5a6a"/>
<text x="52" y="583" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">1</text>
<text x="74" y="583" font-size="15" font-weight="700" fill="#ff5a6a">Subah RAM bhar gayi</text>
<text x="52" y="610" font-size="13.5" fill="#7fe0b0">Sabse der se chhui key (user:7) bahar. Wo</text>
<text x="52" y="630" font-size="13.5" fill="#7fe0b0">kabhi chahiye to ek miss, DB se wapas</text>
<rect x="30" y="708" width="1440" height="66" rx="9" fill="#221c08" stroke="#ffcc4d" stroke-width="2"/>
<text x="48" y="734" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>
<text x="48" y="758" font-size="13.5" fill="#e6dcb8">Jo sabse kam baar chhua, wo hatao (LFU): Kal ki famous key aaj bhi baithi rehti. Isliye zyadatar LRU</text>
<rect x="30" y="796" width="1440" height="116" rx="9" fill="#141c2b" stroke="#3a4a63" stroke-width="2"/>
<text x="48" y="826" font-size="13.5" fill="#c9d6e8">Hatana hi band kar do (noeviction)? To naya likhna error deta. Cache me allkeys-lru rakho.</text>
<text x="48" y="848" font-size="13.5" fill="#c9d6e8">Arpan ki profile phir padhi? Utha ke aage, ab sabse baad me nikalegi</text>
<text x="48" y="870" font-size="13.5" fill="#c9d6e8">Umar kitni rakhein? Jitna purana chal jaaye: profile = minute, price / stock = second.</text>
<text x="48" y="892" font-size="13.5" fill="#c9d6e8">Umar khatam to agla padhne wala DB se taaza laata. Cache khaali ho tab bhi sahi data DB se</text>
<rect x="30" y="934" width="1440" height="44" rx="9" fill="#221c08" stroke="#ffcc4d" stroke-width="2"/>
<text x="48" y="962" font-size="15" font-weight="700" fill="#ffcc4d">AGLA &gt;</text>
<text x="118" y="962" font-size="14.5" fill="#e6dcb8">ab ek machine me jagah ka hisaab ho gaya. Par data hi ek machine se bada (card 2)</text>
