<text x="30" y="40" font-size="26" font-weight="700" fill="#e6edf3">Card 8: har mahine ka alag hissa (partition). Purana mahina nikaal ke S3 me. Postgres me sirf haal ke mahine</text>

<text x="118" y="113" font-size="14.5" fill="#c9d6e8">card 7 me search: har shabd ki list (Elasticsearch)</text>

<text x="48" y="390" font-size="14" font-weight="700" fill="#3ddc97">Kyun chalta:</text>
<text x="160" y="390" font-size="13.5" fill="#cfeee0">Har mahine ka alag tukda (partition). Naya mahina Postgres me (garam, tez), purana S3 me (thanda, sasta). Arpan purani khabar khole to khulti, bas dheemi</text>
<rect x="30" y="438" width="345" height="128" rx="9" fill="#1a0f14" stroke="#ff5a6a" stroke-width="2"/>
<circle cx="52" cy="463" r="12" fill="#ff5a6a"/>
<text x="52" y="468" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">1</text>
<text x="74" y="468" font-size="15" font-weight="700" fill="#ff5a6a">Mahina alag karte waqt (DETACH) lock</text>
<text x="74" y="489" font-size="15" font-weight="700" fill="#ff5a6a">laga</text>
<text x="52" y="516" font-size="13.5" fill="#7fe0b0">Pal bhar padhna ruka. Postgres 14+: DETACH</text>
<text x="52" y="536" font-size="13.5" fill="#7fe0b0">... CONCURRENTLY, bina lock</text>
<rect x="30" y="601" width="1440" height="66" rx="9" fill="#221c08" stroke="#ffcc4d" stroke-width="2"/>
<text x="48" y="627" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>
<text x="48" y="651" font-size="13.5" fill="#e6dcb8">Sab ek hi table me (May se Oct): Purana koi nahi padhta, par disk aur backup ka kharcha</text>
<rect x="30" y="689" width="1440" height="72" rx="9" fill="#141c2b" stroke="#3a4a63" stroke-width="2"/>
<text x="48" y="719" font-size="13.5" fill="#c9d6e8">3 saal baad DB kitna? Utna hi: naya garam, purana S3. Bilkul nahi chahiye to hata do (DROP).</text>
<text x="48" y="741" font-size="13.5" fill="#c9d6e8">Purana hatana = retention. Isse sharding mat samjho</text>
<rect x="30" y="783" width="1440" height="44" rx="9" fill="#221c08" stroke="#ffcc4d" stroke-width="2"/>
<text x="48" y="811" font-size="15" font-weight="700" fill="#ffcc4d">AGLA &gt;</text>
<text x="118" y="811" font-size="14.5" fill="#e6dcb8">ab jagah theek. Par source hi 100 guna ho gaye (card 9)</text>
