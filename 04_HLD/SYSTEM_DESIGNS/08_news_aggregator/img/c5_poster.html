<text x="48" y="510" font-size="14" font-weight="700" fill="#3ddc97">Kyun chalta:</text>
<text x="160" y="510" font-size="13.5" fill="#cfeee0">Ek beemar source baaki ko nahi rokta. 2-3 sec se zyada intezaar nahi, baar-baar fail to breaker khula (us source ko call band). Uski khabar kuch der nahi</text>

<text x="48" y="759" font-size="14" font-weight="700" fill="#ffcc4d">Doosra tareeka kyun nahi?</text>

<text x="48" y="851" font-size="13.5" fill="#c9d6e8">Source ne 429 diya? Dheere chalo, uska &quot;kab aao&quot; (Retry-After) maano. Kai din se khula? Alert, source list se bahar.</text>
<text x="48" y="873" font-size="13.5" fill="#c9d6e8">Thodi der baad ek test call (HALF-OPEN), theek nikli to breaker band (CLOSED)</text>
