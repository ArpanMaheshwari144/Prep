# ─────────────────────────────────────────────
#  Nginx RATE-LIMITER demo — sirf CONFIG (koi program nahi)
#  Ye 2 line hi asli rate-limiter hain (neeche (1) aur (2)).
# ─────────────────────────────────────────────
events {}

http {

    # (1) BUCKET banao — har IP ka apna token-bucket
    #     rate=1r/m   = refill speed: sirf 1 token per MINUTE (bahut tight)
    #                   -> burst khatam hote hi block, kyunki refill na ke barabar
    #     zone=mylimit = is bucket ka naam (10m = memory)
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=1r/m;

    server {
        listen 80;

        location / {
            # (2) LIMIT lagao is route pe — upar wala "mylimit" bucket use karo
            #     burst=5   = bucket ka size (ek saath max 5 request jhel lega)
            #     nodelay   = burst ko turant serve karo (queue me lataka mat)
            #     bucket khaali -> agli request = 503
            limit_req zone=mylimit burst=20 nodelay;

            # AASLI content serve karo (default nginx welcome page).
            # ★ IMPORTANT: "return 200" MAT use karo yahan -- wo limit_req se PEHLE
            #   wale phase me chalta, request rate-limiter tak jaati hi nahi (limit bypass).
            #   File serve karne se limit_req (preaccess phase) pehle chalta -> tabhi 503 aata.
            root /usr/share/nginx/html;
            index index.html;
        }
    }
}
