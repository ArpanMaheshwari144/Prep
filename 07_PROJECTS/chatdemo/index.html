<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>chat demo</title>
  <style>
    body { font-family: monospace; margin: 24px; background: #111; color: #ddd; }
    h2 { margin: 0 0 4px; }
    #status { color: #888; margin-bottom: 16px; }
    #log { border: 1px solid #333; padding: 12px; height: 300px; overflow-y: auto;
           white-space: pre-wrap; background: #000; }
    .in  { color: #6fcf6f; }
    .out { color: #7aa7ff; }
    .sys { color: #888; }
    input, button { font-family: monospace; font-size: 14px; padding: 6px; margin-top: 12px;
                    background: #222; color: #ddd; border: 1px solid #444; }
  </style>
</head>
<body>

<h2 id="me"></h2>
<div id="status">jud raha hoon...</div>

<div id="log"></div>

<div>
  kisko: <input id="to" size="6" placeholder="B">
  kya:   <input id="text" size="40" placeholder="message...">
  <button onclick="bhejo()">bhejo</button>
</div>

<script>
  const me = new URLSearchParams(location.search).get('me') || 'A';
  document.getElementById('me').textContent = 'main = ' + me;

  function likho(cls, line) {
    const log = document.getElementById('log');
    log.innerHTML += '<span class="' + cls + '">' + line + '</span>\n';
    log.scrollTop = log.scrollHeight;
  }

  // ---- ye connection KHULI rehti hai, band nahi hoti ----
  const es = new EventSource('/connect?user=' + me);

  es.onopen = () => {
    document.getElementById('status').textContent = 'JUD GAYA — ye connection ab khuli padi hai';
  };

  es.onmessage = (e) => {
    likho('in', '<-- ' + e.data);
  };

  es.onerror = () => {
    document.getElementById('status').textContent = 'connection TOOT gayi (server band hai?)';
  };

  function bhejo() {
    const to = document.getElementById('to').value;
    const text = document.getElementById('text').value;
    if (!to || !text) return;
    fetch('/send?from=' + me + '&to=' + to + '&text=' + encodeURIComponent(text))
      .then(r => r.text())
      .then(jawab => {
        likho('out', '--> ' + to + ' : ' + text);
        likho('sys', '    (server bola: ' + jawab + ')');
      });
    document.getElementById('text').value = '';
  }

  document.getElementById('text').addEventListener('keydown', e => {
    if (e.key === 'Enter') bhejo();
  });
</script>

</body>
</html>
